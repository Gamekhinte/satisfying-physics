<title>Squish Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Familjen+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one full-screen kitchen scene (canvas), thin top bar + bottom tray floating over it. Single dark look by choice. */
:root{
  --bg:#141917;
  --panel:rgba(18,22,20,.78);
  --line:rgba(255,236,210,.14);
  --fg:#f6ead8;
  --muted:#b9a993;
  --accent:#ff5a3c;
  --display:"Shrikhand","Georgia",serif;
  --ui:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden}
canvas#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));pointer-events:none}
.logo{font-family:var(--display);font-size:19px;line-height:1;color:var(--fg);text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 18px rgba(255,90,60,.35);transform:rotate(-3deg)}
.top .right{display:flex;gap:6px;align-items:center;pointer-events:auto}
.meter{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center;backdrop-filter:blur(8px)}
.meter b{color:var(--fg);font-variant-numeric:tabular-nums;font-size:14px;letter-spacing:0;min-width:3.2ch;text-align:right}
.bar{width:34px;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb000,var(--accent))}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:700 13px var(--ui);border-radius:999px;padding:7px 12px;backdrop-filter:blur(8px);cursor:pointer}
[hidden]{display:none!important}
.btn.icon{padding:6px 8px;display:grid;place-items:center}.btn.icon svg{width:18px;height:18px}
.btn:focus-visible,.tool:focus-visible,.food:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:8px;align-items:center;
  padding:0 max(10px,env(safe-area-inset-right,0px)) 12px max(10px,env(safe-area-inset-left,0px));pointer-events:none}
.tools,.tray{pointer-events:auto;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:4px;backdrop-filter:blur(10px);max-width:100%}
.tool{appearance:none;border:0;background:transparent;color:var(--muted);font:700 13px var(--ui);display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:14px;cursor:pointer}
.tool svg{width:20px;height:20px}
.tool[aria-pressed="true"]{background:var(--fg);color:#1a1512}
.tray{overflow-x:auto;scrollbar-width:none}
.food{appearance:none;border:0;background:transparent;color:var(--muted);font:500 11px var(--ui);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;border-radius:12px;cursor:pointer;min-width:58px}
.food:active{background:rgba(255,255,255,.08)}
.food canvas{width:44px;height:44px}
.hint{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--fg);pointer-events:none;transition:opacity .6s;text-align:center;max-width:calc(100% - 32px)}
</style>

<div id="app">
  <canvas id="c"></canvas>
  <div class="top">
    <div class="logo">Squish Kitchen</div>
    <div class="right">
      <div class="meter" title="Wie dreckig die Küche ist">Sauerei <span class="bar"><i id="mbar"></i></span><b id="mess">0%</b></div>
      <button class="btn icon" id="snd" aria-label="Ton ausschalten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z"/><path id="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path id="xmark" d="M16 10l5 5M21 10l-5 5" hidden/></svg></button>
      <button class="btn" id="clean">Putzen</button>
    </div>
  </div>
  <div class="hint" id="hint">Wirf, schneide und zerquetsch das Essen</div>
  <div class="bottom">
    <div class="tools" role="group" aria-label="Werkzeug">
      <button class="tool" data-tool="hand" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5V4a1.5 1.5 0 0 1 3 0v7m0-5.5a1.5 1.5 0 0 1 3 0V12m0-3.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-4.6-2.2L4.4 15.6a1.6 1.6 0 0 1 2.4-2.1L8 14.8"/></svg>Greifen</button>
      <button class="tool" data-tool="knife" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l7.5-7.5"/><path d="M10.5 13.5L20 4c1 3-1 9-7 11.5z"/></svg>Messer</button>
      <button class="tool" data-tool="mallet" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="12" height="7" rx="1.5" transform="rotate(45 15 6)"/><path d="M11.5 12.5L3.5 20.5"/></svg>Klopfen</button>
    </div>
    <div class="tray" id="tray" aria-label="Essen holen"></div>
  </div>
</div>

<script>
(()=>{
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const bg=document.createElement('canvas'), bgx=bg.getContext('2d');
const st=document.createElement('canvas'), stx=st.getContext('2d');
let W=0,H=0,DPR=1,floorY=0,counterTop=0,counterFront=0;
let X=ctx; // current draw target
const G=0.42, TAU=Math.PI*2;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ---------- materials ---------- */
const M={
  tomato:{label:'Tomate',r:36,n:22,k:.2,edge:.5,press:.7,thresh:10.5,frag:5.5,squeeze:3,plastic:.02,bounce:.12,fric:.8,hammer:1.3,
    skin:['#ff7a55','#d9200f','#6e0904'],flesh:'#e8402c',fleshHi:'#ff9b78',fleshDk:'#9e150a',juice:'#c01a0c',seed:'#f1d27c',spec:.8,chunks:3,stem:true},
  orange:{label:'Orange',r:34,n:22,k:.45,edge:.7,press:.5,thresh:18,frag:3.2,squeeze:1.5,plastic:.005,bounce:.25,fric:.85,hammer:.75,
    skin:['#ffc067','#f27d0c','#8f3a02'],flesh:'#ff9d2e',fleshHi:'#ffd890',fleshDk:'#d86a06',juice:'#ff9612',seed:'#fff2c8',spec:.5,chunks:3,stem:true,dimples:true},
  egg:{label:'Ei',r:24,n:20,k:.95,edge:1,press:.2,thresh:5.5,frag:40,squeeze:30,plastic:0,bounce:.15,fric:.7,hammer:3,
    skin:['#fffaf0','#ead8bd','#8f7a5c'],flesh:'#fff',fleshHi:'#fff',fleshDk:'#ddd',juice:'#f5edd0',seed:'#000',spec:.55,chunks:0},
  jelly:{label:'Pudding',r:38,n:28,k:.05,edge:.22,press:1,thresh:999,frag:0,squeeze:0,plastic:0,bounce:.3,fric:.75,hammer:.45,
    skin:['rgba(190,255,150,.9)','rgba(50,200,70,.82)','rgba(8,95,35,.9)'],flesh:'rgba(60,210,80,.85)',fleshHi:'rgba(190,255,150,.9)',fleshDk:'rgba(8,95,35,.9)',juice:'#3cc24a',seed:'#000',spec:1,chunks:6,jelly:true},
  melon:{label:'Melone',r:62,n:32,k:.55,edge:.7,press:.5,thresh:16,frag:3.5,squeeze:1.2,plastic:.004,bounce:.12,fric:.85,hammer:.55,
    skin:['#6fb94b','#2e6f1d','#0f300a'],flesh:'#f2384c',fleshHi:'#ff8f96',fleshDk:'#b8182b',juice:'#e0283f',seed:'#1b120e',spec:.45,chunks:5,stripes:true,rind:true},
  yolk:{label:'Dotter',r:14,n:16,k:.12,edge:.3,press:.9,thresh:8,frag:18,squeeze:6,plastic:0,bounce:.05,fric:.6,hammer:3,
    skin:['#ffe98a','#ffae00','#b56300'],flesh:'#ffb300',fleshHi:'#ffe28a',fleshDk:'#c87800',juice:'#ffb000',seed:'#000',spec:.95,chunks:0},
};
const FOODS=['tomato','orange','egg','jelly','melon'];

/* ---------- world ---------- */
let bodies=[], drops=[], drips=[], fx=[], uid=0, frame=0, shake=0, mess=0;
let tool='hand';

function P(x,y,vx=0,vy=0){return{x,y,px:x-vx,py:y-vy,cut:false,stem:false,s1:Math.random(),s2:Math.random()}}
function polyArea(p){let a=0;for(let i=0,n=p.length;i<n;i++){const q=p[i],r=p[(i+1)%n];a+=q.x*r.y-r.x*q.y}return a/2}
function makeTex(R){const dots=[];for(let i=0;i<140;i++){const a=Math.random()*TAU,r=Math.sqrt(Math.random())*R;dots.push({x:Math.cos(a)*r,y:Math.sin(a)*r,s:Math.random()})}return{R,dots}}

function shapeOffset(type,t,r){
  const c=Math.cos(t),s=Math.sin(t);
  if(type==='egg'){return[r*.8*c*(1+.13*s),r*1.02*s]}
  if(type==='jelly'){const e=.42;return[r*1.05*Math.sign(c)*Math.pow(Math.abs(c),e),r*.92*Math.sign(s)*Math.pow(Math.abs(s),e)]}
  if(type==='melon'){return[r*1.25*c,r*.92*s]}
  if(type==='tomato'){const k=1+.035*Math.cos(5*t);return[r*1.04*c*k,r*.88*s*k]}
  if(type==='orange'){return[r*c,r*.97*s]}
  return[r*c,r*s];
}
function makeBody(type,x,y,o={}){
  const m=M[type], n=o.n||m.n, r=o.r||m.r, pts=[];
  for(let i=0;i<n;i++){const t=i/n*TAU;let[ox,oy]=shapeOffset(type,t,r);
    if(o.blob){const k=1+.22*Math.sin(t*3+o.blob)+.1*Math.sin(t*5+o.blob*2);ox*=k;oy*=k}
    pts.push(P(x+ox,y+oy,o.vx||0,o.vy||0))}
  if(m.stem&&!o.chunk) pts[Math.round(n*.75)%n].stem=true;
  if(o.vr){for(const p of pts){const dx=p.x-x,dy=p.y-y;p.px+= dy*o.vr;p.py-= dx*o.vr}}
  return initBody(type,pts,{chunk:o.chunk,tex:makeTex(r*1.3)});
}
function initBody(type,pts,o){
  if(polyArea(pts)<0)pts.reverse();
  const n=pts.length;let cx=0,cy=0;for(const p of pts){cx+=p.x;cy+=p.y}cx/=n;cy/=n;
  const rest=pts.map(p=>({x:p.x-cx,y:p.y-cy}));
  const L=pts.map((p,i)=>{const q=pts[(i+1)%n];return Math.hypot(q.x-p.x,q.y-p.y)});
  const A=polyArea(pts);
  return{type,m:M[type],pts,rest,L,restArea:A,R:Math.sqrt(A/Math.PI),rot:0,cx,cy,health:100,imp:0,inv:o.inv||0,
    chunk:!!o.chunk,tex:o.tex,texOff:o.texOff||{x:0,y:0},texRot0:o.texRot0||0,hits:[],id:++uid,
    minX:0,maxX:0,minY:0,maxY:0,sndCd:0};
}
function add(b){bodies.push(b);trimBodies();return b}
function trimBodies(){
  while(bodies.length>30){const i=bodies.findIndex(b=>b.chunk||b.type==='yolk');if(i<0)break;burst(bodies[i],true)}
}

/* ---------- physics ---------- */
function shapeMatch(b,k,first){
  const p=b.pts,q=b.rest,n=p.length;let cx=0,cy=0;
  for(const a of p){cx+=a.x;cy+=a.y}cx/=n;cy/=n;
  let s=0,c=0;for(let i=0;i<n;i++){const dx=p[i].x-cx,dy=p[i].y-cy;c+=q[i].x*dx+q[i].y*dy;s+=q[i].x*dy-q[i].y*dx}
  const a=Math.atan2(s,c),co=Math.cos(a),si=Math.sin(a);b.rot=a;b.cx=cx;b.cy=cy;
  const pl=first?b.m.plastic:0, lim=b.R*.12;
  for(let i=0;i<n;i++){const r=q[i],gx=cx+r.x*co-r.y*si,gy=cy+r.x*si+r.y*co;
    if(pl){const dx=p[i].x-cx,dy=p[i].y-cy,lx=dx*co+dy*si,ly=-dx*si+dy*co,ex=lx-r.x,ey=ly-r.y;
      if(ex*ex+ey*ey>lim*lim){r.x+=ex*pl;r.y+=ey*pl}}
    p[i].x+=(gx-p[i].x)*k;p[i].y+=(gy-p[i].y)*k}
}
function edges(b){
  const p=b.pts,n=p.length,s=b.m.edge*.5;
  for(let i=0;i<n;i++){const a=p[i],c=p[(i+1)%n],dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy)||1e-6,f=(d-b.L[i])/d*s;
    a.x+=dx*f;a.y+=dy*f;c.x-=dx*f;c.y-=dy*f}
}
function pressure(b){
  const p=b.pts,n=p.length,A=polyArea(p),diff=(b.restArea-A)/b.restArea;
  if(Math.abs(diff)<.002)return;const f=diff*b.m.press*b.R*.12;
  for(let i=0;i<n;i++){const pr=p[(i+n-1)%n],nx=p[(i+1)%n],tx=nx.x-pr.x,ty=nx.y-pr.y,l=Math.hypot(tx,ty)||1;
    p[i].x+=ty/l*f;p[i].y+=-tx/l*f}
}
function bounds(b,first){
  const m=b.m;
  for(const p of b.pts){
    if(p.y>floorY){const v=p.y-p.py;if(first&&v>b.imp)b.imp=v;p.y=floorY;const vx=p.x-p.px;p.px=p.x-vx*m.fric;p.py=p.y+Math.max(0,v)*m.bounce}
    if(p.x<2){const v=p.px-p.x;if(first&&v>b.imp)b.imp=v;p.x=2;p.px=p.x-Math.max(0,v)*m.bounce}
    else if(p.x>W-2){const v=p.x-p.px;if(first&&v>b.imp)b.imp=v;p.x=W-2;p.px=p.x+Math.max(0,v)*m.bounce}
    if(p.y<-400){p.y=-400;p.py=p.y}
  }
}
function aabb(b){let a=1e9,c=-1e9,d=1e9,e=-1e9;for(const p of b.pts){if(p.x<a)a=p.x;if(p.x>c)c=p.x;if(p.y<d)d=p.y;if(p.y>e)e=p.y}b.minX=a;b.maxX=c;b.minY=d;b.maxY=e}
function inside(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];if((a.y>y)!==(b.y>y)&&x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)c=!c}return c}
function pushPoints(a,b,first){
  const bp=b.pts,n=bp.length,wa=b.restArea/(a.restArea+b.restArea),wb=1-wa;
  for(const p of a.pts){
    if(p.x<b.minX||p.x>b.maxX||p.y<b.minY||p.y>b.maxY||!inside(p.x,p.y,bp))continue;
    let best=1e18,bj=0,bt=0,qx=0,qy=0;
    for(let j=0;j<n;j++){const e0=bp[j],e1=bp[(j+1)%n],ex=e1.x-e0.x,ey=e1.y-e0.y;
      const t=clamp(((p.x-e0.x)*ex+(p.y-e0.y)*ey)/(ex*ex+ey*ey||1),0,1),x=e0.x+ex*t,y=e0.y+ey*t,d=(x-p.x)**2+(y-p.y)**2;
      if(d<best){best=d;bj=j;bt=t;qx=x;qy=y}}
    const e0=bp[bj],e1=bp[(bj+1)%n],dx=qx-p.x,dy=qy-p.y;
    if(first){const rv=Math.hypot((p.x-p.px)-(e0.x-e0.px),(p.y-p.py)-(e0.y-e0.py))*.75;if(rv>a.imp)a.imp=rv;if(rv>b.imp)b.imp=rv}
    p.x+=dx*wa;p.y+=dy*wa;
    e0.x-=dx*wb*(1-bt);e0.y-=dy*wb*(1-bt);e1.x-=dx*wb*bt;e1.y-=dy*wb*bt;
    // a little friction
    const fx=(p.x-p.px)*.04,fy=(p.y-p.py)*.04;p.px+=fx;p.py+=fy;
  }
}

/* ---------- input ---------- */
const ptr={down:false,x:0,y:0,lx:0,ly:0,grab:null,gi:0,trail:[]};
function local(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{
  audioInit();hideHint();
  cv.setPointerCapture(e.pointerId);const[x,y]=local(e);ptr.down=true;ptr.x=ptr.lx=x;ptr.y=ptr.ly=y;ptr.trail=[{x,y,t:performance.now()}];
  for(const b of bodies)b.hits=[];
  if(tool==='hand'){
    let pick=null;
    for(let i=bodies.length-1;i>=0;i--){const b=bodies[i];if(inside(x,y,b.pts)){pick=b;break}}
    if(!pick){let bd=40*40;for(const b of bodies)for(const p of b.pts){const d=(p.x-x)**2+(p.y-y)**2;if(d<bd){bd=d;pick=b}}}
    if(pick){let bi=0,bd=1e18;pick.pts.forEach((p,i)=>{const d=(p.x-x)**2+(p.y-y)**2;if(d<bd){bd=d;bi=i}});
      ptr.grab=pick;ptr.gi=bi;bodies.splice(bodies.indexOf(pick),1);bodies.push(pick);sfx.squish(.15)}
  }else if(tool==='mallet'){smash(x,y)}
});
cv.addEventListener('pointermove',e=>{
  if(!ptr.down)return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of (evs.length?evs:[e])){const[x,y]=local(ev);ptr.lx=ptr.x;ptr.ly=ptr.y;ptr.x=x;ptr.y=y;
    if(tool==='knife'){ptr.trail.push({x,y,t:performance.now()});knife(ptr.lx,ptr.ly,x,y)}}
});
function up(){ptr.down=false;ptr.grab=null;for(const b of bodies)b.hits=[]}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

function segInt(ax,ay,bx,by,cx,cy,dx,dy){const r1=bx-ax,r2=by-ay,s1=dx-cx,s2=dy-cy,den=r1*s2-r2*s1;if(Math.abs(den)<1e-9)return null;
  const t=((cx-ax)*s2-(cy-ay)*s1)/den,u=((cx-ax)*r2-(cy-ay)*r1)/den;return(t>=0&&t<=1&&u>=0&&u<=1)?{x:ax+r1*t,y:ay+r2*t,t}:null}
function knife(ax,ay,bx,by){
  if(Math.hypot(bx-ax,by-ay)<1)return;
  for(const b of bodies.slice()){
    if(Math.max(ax,bx)<b.minX||Math.min(ax,bx)>b.maxX||Math.max(ay,by)<b.minY||Math.min(ay,by)>b.maxY)continue;
    const hs=[];const p=b.pts,n=p.length;
    for(let i=0;i<n;i++){const q=p[i],r=p[(i+1)%n],h=segInt(ax,ay,bx,by,q.x,q.y,r.x,r.y);if(h)hs.push(h)}
    hs.sort((u,v)=>u.t-v.t);b.hits.push(...hs);
    if(b.hits.length>=2){const A=b.hits[0],B=b.hits[b.hits.length-1];b.hits=[];
      if(Math.hypot(B.x-A.x,B.y-A.y)>b.R*.25)cut(b,A,B)}
  }
}

/* ---------- cutting ---------- */
function cut(b,A,B){
  if(b.type==='egg'||b.type==='yolk'){burst(b);return}
  const pts=b.pts,n=pts.length,dx=B.x-A.x,dy=B.y-A.y;
  const side=pts.map(p=>dx*(p.y-A.y)-dy*(p.x-A.x));
  const cr=[];for(let i=0;i<n;i++)if((side[i]>0)!==(side[(i+1)%n]>0))cr.push(i);
  if(cr.length!==2)return;
  const[i1,i2]=cr;
  const ip=i=>{const j=(i+1)%n,t=side[i]/(side[i]-side[j]),p=pts[i],q=pts[j];
    return{x:p.x+(q.x-p.x)*t,y:p.y+(q.y-p.y)*t,px:p.px+(q.px-p.px)*t,py:p.py+(q.py-p.py)*t}};
  const I1=ip(i1),I2=ip(i2);
  const avgL=b.L.reduce((s,v)=>s+v,0)/n;
  const mk=(I)=>Object.assign(P(I.x,I.y),{px:I.px,py:I.py,cut:true});
  const chord=(F,T)=>{const d=Math.hypot(T.x-F.x,T.y-F.y),k=Math.max(0,Math.round(d/avgL)-1),o=[];
    for(let i=1;i<=k;i++){const t=i/(k+1);o.push(mk({x:F.x+(T.x-F.x)*t,y:F.y+(T.y-F.y)*t,px:F.px+(T.px-F.px)*t,py:F.py+(T.py-F.py)*t}))}return o};
  const ring=(f,t)=>{const o=[];for(let k=f;;k=(k+1)%n){o.push(pts[k]);if(k===t)break}return o};
  const p1=[mk(I1),...ring((i1+1)%n,i2),mk(I2),...chord(I2,I1)];
  const p2=[mk(I2),...ring((i2+1)%n,i1),mk(I1),...chord(I1,I2)];
  const O={x:b.cx+b.texOff.x*Math.cos(b.rot)-b.texOff.y*Math.sin(b.rot),y:b.cy+b.texOff.x*Math.sin(b.rot)+b.texOff.y*Math.cos(b.rot)};
  const TA=b.texRot0+b.rot, len=Math.hypot(dx,dy)||1, nx=-dy/len, ny=dx/len;
  remove(b);sfx.cut();
  [[p1,side[(i1+1)%n]>0?1:-1],[p2,side[(i2+1)%n]>0?1:-1]].forEach(([pp,sg])=>{
    const s=sg*1;for(const p of pp){p.x+=nx*s*1.5;p.y+=ny*s*1.5;p.px+=nx*s*.6;p.py+=ny*s*.6}
    const a=Math.abs(polyArea(pp));
    if(pp.length<6||a<140){spray(pp,b.m,Math.max(3,a/25),b.type);return}
    let cx=0,cy=0;for(const p of pp){cx+=p.x;cy+=p.y}cx/=pp.length;cy/=pp.length;
    add(initBody(b.type,pp,{chunk:b.chunk,tex:b.tex,texOff:{x:O.x-cx,y:O.y-cy},texRot0:TA,inv:10}));
  });
  // juice along the cut
  const m=b.m,cnt=b.type==='jelly'?2:Math.min(26,4+b.R*.35);
  for(let i=0;i<cnt;i++){const t=Math.random(),x=I1.x+(I2.x-I1.x)*t,y=I1.y+(I2.y-I1.y)*t,sg=Math.random()<.5?1:-1;
    drop(x,y,nx*sg*rnd(.5,3),ny*sg*rnd(.5,3)-rnd(0,1.5),m.juice,rnd(1.2,3))}
  buzz(12);
}

/* ---------- bursting ---------- */
function remove(b){const i=bodies.indexOf(b);if(i>=0)bodies.splice(i,1);if(ptr.grab===b)ptr.grab=null}
function bodyVel(b){let vx=0,vy=0;for(const p of b.pts){vx+=p.x-p.px;vy+=p.y-p.py}return[vx/b.pts.length,vy/b.pts.length]}
function spray(pts,m,count,type){
  let cx=0,cy=0,vx=0,vy=0;for(const p of pts){cx+=p.x;cy+=p.y;vx+=p.x-p.px;vy+=p.y-p.py}const n=pts.length;cx/=n;cy/=n;vx/=n;vy/=n;
  for(let i=0;i<count;i++){const p=pts[(Math.random()*n)|0],t=Math.random(),x=cx+(p.x-cx)*t,y=cy+(p.y-cy)*t,a=Math.atan2(y-cy,x-cx),s=rnd(1,7);
    drop(x,y,vx*.6+Math.cos(a)*s,vy*.4+Math.sin(a)*s-rnd(1,4),m.juice,rnd(1.2,4.2),type==='jelly'?.55:1)}
}
function burst(b,quiet){
  remove(b);const m=b.m,[vx,vy]=bodyVel(b);
  if(quiet){spray(b.pts,m,6,b.type);return}
  if(b.type==='egg'){
    sfx.crack();
    for(let i=0;i<14;i++)drops.push({k:'shell',x:b.cx+rnd(-12,12),y:b.cy+rnd(-15,15),vx:vx+rnd(-4,4),vy:vy*.3+rnd(-6,-1),r:rnd(0,TAU),vr:rnd(-.3,.3),s:rnd(3,6.5),life:900+rnd(0,300)});
    for(let i=0;i<40;i++){const a=rnd(0,TAU),s=rnd(.5,5);drop(b.cx+rnd(-8,8),b.cy+rnd(-8,8),vx*.5+Math.cos(a)*s,vy*.3+Math.sin(a)*s-1,'#f4eccf',rnd(2,5),.45)}
    const y=add(makeBody('yolk',b.cx,b.cy,{vx:vx*.5,vy:Math.min(vy,2)}));y.inv=12;
    buzz(25);return;
  }
  const big=b.R/40;
  sfx.splat(clamp(.35+big*.3,.3,1));
  spray(b.pts,m,Math.min(90,b.restArea/22),b.type);
  if(m.seed!=='#000'&&!b.chunk)for(let i=0;i<(b.type==='melon'?14:8);i++){const a=rnd(0,TAU),s=rnd(1,6);
    drops.push({k:'seed',x:b.cx+rnd(-b.R*.5,b.R*.5),y:b.cy+rnd(-b.R*.5,b.R*.5),vx:vx+Math.cos(a)*s,vy:vy*.3+Math.sin(a)*s-2,c:m.seed,s:b.type==='melon'?3:2,fy:floorY+rnd(-12,18),r:rnd(0,TAU)})}
  if(!b.chunk&&m.chunks&&b.R>14){
    const k=m.chunks;for(let i=0;i<k;i++){const a=i/k*TAU+rnd(0,1),r=b.R*rnd(.25,.42),d=b.R*.35;
      const c=add(makeBody(b.type,b.cx+Math.cos(a)*d,b.cy+Math.sin(a)*d,{r,n:12,chunk:true,blob:rnd(0,9),vx:vx*.5+Math.cos(a)*rnd(2,6),vy:vy*.3+Math.sin(a)*rnd(2,5)-3}));c.inv=14}
  }
  shake=Math.max(shake,4+big*5);buzz(30);
}
function drop(x,y,vx,vy,c,s,alpha=1){if(drops.length>1600)return;drops.push({k:'drop',x,y,vx,vy,c,s,a:alpha,fy:floorY+rnd(-14,20)})}

/* ---------- mallet ---------- */
function smash(x,y){
  const R=78;let hitAny=false;
  for(const b of bodies.slice()){
    let mx=0;for(const p of b.pts){const dx=p.x-x,dy=p.y-y,d=Math.hypot(dx,dy);
      if(d<R){const f=1-d/R;mx=Math.max(mx,f);const k=f*15/(d||1);p.x+=dx*k*.7;p.y+=dy*k*.5+f*10}}
    if(inside(x,y,b.pts))mx=1;
    if(mx>0){hitAny=true;b.health-=100*mx*b.m.hammer;if(b.health<=0&&!b.inv)burst(b)}
  }
  fx.push({k:'ring',x,y,t:0});
  shake=Math.max(shake,hitAny?9:4);sfx.bonk(hitAny?.9:.5);if(hitAny)sfx.squish(.6);buzz(hitAny?35:10);
}

/* ---------- step ---------- */
function step(){
  frame++;
  for(const b of bodies)for(const p of b.pts){const vx=(p.x-p.px)*.996,vy=(p.y-p.py)*.996;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+G}
  const IT=4;
  for(let it=0;it<IT;it++){
    const first=it===0;
    for(const b of bodies){shapeMatch(b,b.m.k*.5,first);edges(b);pressure(b)}
    if(ptr.grab&&ptr.down){const b=ptr.grab,n=b.pts.length;for(let k=-2;k<=2;k++){const p=b.pts[(ptr.gi+k+n)%n],w=k?.18:.45;p.x+=(ptr.x-p.x)*w;p.y+=(ptr.y-p.y)*w}}
    for(const b of bodies)aabb(b);
    for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){const a=bodies[i],c=bodies[j];
      if(a.maxX<c.minX||c.maxX<a.minX||a.maxY<c.minY||c.maxY<a.minY)continue;pushPoints(a,c,first);pushPoints(c,a,first)}
    for(const b of bodies)bounds(b,first);
  }
  for(const b of bodies.slice()){
    const m=b.m;if(b.sndCd>0)b.sndCd--;
    if(b.inv>0){b.inv--;b.imp=0;continue}
    if(b.imp>3.5&&!b.sndCd){(b.type==='egg'?sfx.bonk:sfx.squish)(clamp(b.imp/25,.05,.6));b.sndCd=8}
    const th=b.chunk?m.thresh*.85:m.thresh;
    if(b.imp>th)b.health-=(b.imp-th)*m.frag*(b.chunk?1.3:1);
    const ratio=Math.abs(polyArea(b.pts))/b.restArea;
    if(ratio<.62&&m.squeeze)b.health-=(.62-ratio)*40*m.squeeze;
    b.imp=0;
    if(b.health<=0)burst(b);
  }
  // particles
  for(let i=drops.length-1;i>=0;i--){const d=drops[i];
    d.vy+=G*.9;d.vx*=.995;d.x+=d.vx;d.y+=d.vy;
    if(d.x<0){d.x=0;d.vx*=-.3}else if(d.x>W){d.x=W;d.vx*=-.3}
    if(d.k==='shell'){d.r+=d.vr;if(d.y>floorY-1){d.y=floorY-1;d.vy*=-.25;d.vx*=.6;d.vr*=.5}if(--d.life<0)drops.splice(i,1);continue}
    if(d.k==='seed'){d.r+=.2;if(d.y>=d.fy){stampSeed(d);drops.splice(i,1)}continue}
    const sp=Math.hypot(d.vx,d.vy);
    if(d.y<counterTop-4&&sp>7&&Math.random()<.025){stampWall(d.x,d.y,d.c,d.s,d.a);drops.splice(i,1);continue}
    if(d.y>=d.fy){stampFloor(d.x,d.fy,d.c,d.s,d.a);drops.splice(i,1)}
  }
  for(let i=drips.length-1;i>=0;i--){const d=drips[i];d.y+=d.v;d.x+=rnd(-.15,.15);d.w*=.997;d.len-=d.v;
    stx.globalAlpha=.5*d.a;stx.fillStyle=d.c;stx.beginPath();stx.arc(d.x,d.y,d.w,0,TAU);stx.fill();stx.globalAlpha=1;
    if(d.len<=0||d.y>counterTop-2||d.w<.4)drips.splice(i,1)}
  for(let i=fx.length-1;i>=0;i--){if(++fx[i].t>18)fx.splice(i,1)}
  shake*=.85;
}

/* ---------- stains ---------- */
function addMess(v){mess+=v}
function stampFloor(x,y,c,s,a=1){
  stx.save();stx.fillStyle=c;stx.globalAlpha=.55*a;
  stx.beginPath();stx.ellipse(x,y,s*rnd(1.3,2.2),s*rnd(.45,.6),0,0,TAU);stx.fill();
  if(s>2.5){for(let k=0;k<2;k++){stx.beginPath();stx.ellipse(x+rnd(-s*3,s*3),y+rnd(-s*.6,s*.6),s*.45,s*.18,0,0,TAU);stx.fill()}}
  stx.globalAlpha=.22*a;stx.fillStyle='#fff';stx.beginPath();stx.ellipse(x-s*.5,y-s*.18,s*.5,s*.1,0,0,TAU);stx.fill();
  stx.restore();addMess(s*s);
}
function stampWall(x,y,c,s,a=1){
  stx.save();stx.fillStyle=c;stx.globalAlpha=.6*a;
  stx.beginPath();stx.arc(x,y,s*1.2,0,TAU);stx.fill();
  for(let k=0;k<5;k++){const ang=rnd(0,TAU),d=s*rnd(1.5,4);stx.beginPath();stx.arc(x+Math.cos(ang)*d,y+Math.sin(ang)*d,s*rnd(.15,.45),0,TAU);stx.fill()}
  stx.globalAlpha=.25*a;stx.fillStyle='#fff';stx.beginPath();stx.arc(x-s*.4,y-s*.4,s*.35,0,TAU);stx.fill();
  stx.restore();addMess(s*s*1.5);
  if(s>2.4&&Math.random()<.6)drips.push({x,y:y+s*.6,v:rnd(.25,.7),w:s*.55,len:rnd(30,160),c,a});
}
function stampSeed(d){stx.save();stx.translate(d.x,d.fy);stx.rotate(d.r);stx.fillStyle=d.c;stx.beginPath();stx.ellipse(0,0,d.s*1.4,d.s*.8,0,0,TAU);stx.fill();
  stx.fillStyle='rgba(255,255,255,.35)';stx.beginPath();stx.ellipse(-d.s*.4,-d.s*.3,d.s*.4,d.s*.2,0,0,TAU);stx.fill();stx.restore()}

/* ---------- background ---------- */
function drawBg(){
  const g=bgx;g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle='#151b19';g.fillRect(0,0,W,H);
  // subway tiles
  const tw=clamp(W/5.5,58,110),th=tw/2,gr=2.5;
  for(let r=0,y=-th*.3;y<counterTop;r++,y+=th){
    const off=(r%2)*tw/2;
    for(let x=-off;x<W;x+=tw){
      const v=rnd(-6,6);
      const lg=g.createLinearGradient(0,y,0,y+th);
      lg.addColorStop(0,`rgb(${52+v},${66+v},${62+v})`);lg.addColorStop(.5,`rgb(${40+v},${52+v},${49+v})`);lg.addColorStop(1,`rgb(${33+v},${43+v},${40+v})`);
      g.fillStyle=lg;rr(g,x+gr/2,y+gr/2,tw-gr,th-gr,4);g.fill();
      g.fillStyle='rgba(255,255,255,.07)';rr(g,x+4,y+3,tw-10,3,2);g.fill();
      g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=1;rr(g,x+gr/2,y+gr/2,tw-gr,th-gr,4);g.stroke();
    }
  }
  // warm lamp
  let rg=g.createRadialGradient(W*.42,-H*.05,10,W*.42,-H*.05,H*.95);
  rg.addColorStop(0,'rgba(255,196,130,.28)');rg.addColorStop(.6,'rgba(255,170,100,.06)');rg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=rg;g.fillRect(0,0,W,counterTop);
  // counter top (butcher block, seen slightly from above)
  const ct=counterTop,cf=counterFront;
  let lg=g.createLinearGradient(0,ct,0,cf);lg.addColorStop(0,'#5e3c22');lg.addColorStop(1,'#9a6a40');
  g.fillStyle=lg;g.fillRect(0,ct,W,cf-ct);
  const strips=Math.max(4,Math.round(W/70));
  for(let i=0;i<strips;i++){const y0=ct+(cf-ct)*i/strips,y1=ct+(cf-ct)*(i+1)/strips,v=rnd(-14,14);
    g.fillStyle=`rgba(${120+v},${76+v},${40+v},.35)`;g.fillRect(0,y0,W,y1-y0);
    g.fillStyle='rgba(30,15,5,.35)';g.fillRect(0,y0,W,.8)}
  for(let i=0;i<220;i++){const y=rnd(ct,cf),x=rnd(-50,W),l=rnd(40,220);g.strokeStyle=`rgba(${Math.random()<.5?'40,20,8':'210,160,110'},${rnd(.05,.14)})`;g.lineWidth=rnd(.4,1.4);
    g.beginPath();g.moveTo(x,y);g.bezierCurveTo(x+l*.3,y+rnd(-1.5,1.5),x+l*.6,y+rnd(-1.5,1.5),x+l,y+rnd(-1,1));g.stroke()}
  // wall/counter contact shadow
  lg=g.createLinearGradient(0,ct-18,0,ct+14);lg.addColorStop(0,'rgba(0,0,0,0)');lg.addColorStop(.55,'rgba(0,0,0,.45)');lg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=lg;g.fillRect(0,ct-18,W,32);
  // front edge
  lg=g.createLinearGradient(0,cf,0,H);lg.addColorStop(0,'#6a4426');lg.addColorStop(.08,'#4a2e18');lg.addColorStop(1,'#1c120a');
  g.fillStyle=lg;g.fillRect(0,cf,W,H-cf);
  g.fillStyle='rgba(255,220,170,.35)';g.fillRect(0,cf,W,1.2);
  for(let x=rnd(-30,0);x<W;x+=rnd(28,46)){g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x,cf+2,1,H-cf)}
  for(let i=0;i<120;i++){const y=rnd(cf+4,H),x=rnd(0,W);g.strokeStyle=`rgba(0,0,0,${rnd(.05,.15)})`;g.lineWidth=rnd(.5,1.2);g.beginPath();g.arc(x,y,rnd(2,7),rnd(0,3),rnd(3,6));g.stroke()}
  // vignette
  rg=g.createRadialGradient(W/2,H*.45,Math.min(W,H)*.35,W/2,H*.45,Math.max(W,H)*.85);
  rg.addColorStop(0,'rgba(0,0,0,0)');rg.addColorStop(1,'rgba(0,0,0,.6)');g.fillStyle=rg;g.fillRect(0,0,W,H);
}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

/* ---------- rendering ---------- */
function trace(p){const n=p.length,a=p[n-1],b=p[0];X.moveTo((a.x+b.x)/2,(a.y+b.y)/2);
  for(let i=0;i<n;i++){const q=p[i],r=p[(i+1)%n];X.quadraticCurveTo(q.x,q.y,(q.x+r.x)/2,(q.y+r.y)/2)}X.closePath()}
function drawShadow(b){
  const h=floorY-b.maxY,a=clamp(1-h/260,0,1);if(a<=0)return;
  const w=(b.maxX-b.minX)/2*(1+h/320),cx=(b.minX+b.maxX)/2+h*.12;
  X.save();X.translate(cx,floorY+2);X.scale(1,.2);
  const g=X.createRadialGradient(0,0,0,0,0,w*1.1);
  const col=b.m.jelly?'20,90,30':'0,0,0';
  g.addColorStop(0,`rgba(${col},${.55*a})`);g.addColorStop(.6,`rgba(${col},${.25*a})`);g.addColorStop(1,`rgba(${col},0)`);
  X.fillStyle=g;X.beginPath();X.arc(0,0,w*1.1,0,TAU);X.fill();X.restore();
}
function drawBody(b){
  const m=b.m,p=b.pts,R=b.R,cx=b.cx,cy=b.cy;
  const T={x:cx+b.texOff.x*Math.cos(b.rot)-b.texOff.y*Math.sin(b.rot),y:cy+b.texOff.x*Math.sin(b.rot)+b.texOff.y*Math.cos(b.rot),a:b.texRot0+b.rot};
  const skin=b.chunk?[m.fleshHi,m.flesh,m.fleshDk]:m.skin;
  X.save();X.beginPath();trace(p);X.clip();
  const pad=R*1.6;
  let g=X.createRadialGradient(cx-R*.35,cy-R*.45,R*.08,cx,cy,R*1.3);
  g.addColorStop(0,skin[0]);g.addColorStop(.55,skin[1]);g.addColorStop(1,skin[2]);
  X.fillStyle=g;X.fillRect(cx-pad,cy-pad,pad*2,pad*2);
  // surface texture (in texture frame)
  X.save();X.translate(T.x,T.y);X.rotate(T.a);const tr=b.tex.R;
  if(b.chunk){
    if(m.seed!=='#000'){for(let i=0;i<b.tex.dots.length;i+=(m.rind?16:7)){const d=b.tex.dots[i];X.fillStyle=m.seed;X.globalAlpha=.85;X.beginPath();X.ellipse(d.x*.5,d.y*.5,m.rind?2.4:1.6,m.rind?1.4:1.1,d.s*6,0,TAU);X.fill()}}
    X.globalAlpha=.25;X.fillStyle='#fff';for(let i=1;i<b.tex.dots.length;i+=3){const d=b.tex.dots[i];X.fillRect(d.x*.6,d.y*.6,1.2,1.2)}
  }else if(m.stripes){
    X.globalAlpha=.75;X.strokeStyle='#123d0c';X.lineCap='round';
    for(let k=-4;k<=4;k++){X.lineWidth=tr*.09*(1+.4*Math.sin(k*1.7));X.beginPath();
      for(let s=-1;s<=1.001;s+=.08){const y=s*tr*.75,xx=Math.sin(k/4.6*1.45)*tr*Math.sqrt(1-s*s)*1.05+Math.sin(s*9+k)*tr*.025;s<=-1?X.moveTo(xx,y):X.lineTo(xx,y)}X.stroke()}
    X.globalAlpha=.18;X.fillStyle='#d9f2a0';for(let i=0;i<b.tex.dots.length;i+=2){const d=b.tex.dots[i];X.fillRect(d.x,d.y*.75,1.4,1.4)}
  }else if(m.dimples){
    for(const d of b.tex.dots){X.globalAlpha=.16;X.fillStyle='#7a3000';X.beginPath();X.arc(d.x,d.y,.9+d.s*.9,0,TAU);X.fill();X.globalAlpha=.14;X.fillStyle='#fff3c0';X.beginPath();X.arc(d.x-.7,d.y-.7,.6,0,TAU);X.fill()}
  }else if(b.type==='tomato'){
    X.globalAlpha=.12;X.strokeStyle='#ffd0a0';X.lineWidth=2;for(let k=-2;k<=2;k++){X.beginPath();X.ellipse(0,0,Math.abs(k)*tr*.18+2,tr*.7,0,k<0?Math.PI*.6:-.4,k<0?Math.PI*1.4:.4);X.stroke()}
    X.globalAlpha=.18;X.fillStyle='#ffe6a0';for(let i=0;i<40;i++){const d=b.tex.dots[i];X.fillRect(d.x*.8,d.y*.8,1,1)}
  }else if(b.type==='egg'){
    X.globalAlpha=.16;X.fillStyle='#8a6a40';for(const d of b.tex.dots){X.beginPath();X.arc(d.x*.8,d.y*.8,.5+d.s*.7,0,TAU);X.fill()}
  }
  X.restore();X.globalAlpha=1;
  // exposed flesh along cut edges
  if(!b.chunk)drawCuts(b);
  // jelly glow
  if(m.jelly){g=X.createRadialGradient(cx+R*.3,cy+R*.45,1,cx+R*.3,cy+R*.45,R*.9);g.addColorStop(0,'rgba(220,255,160,.45)');g.addColorStop(1,'rgba(220,255,160,0)');X.fillStyle=g;X.fillRect(cx-pad,cy-pad,pad*2,pad*2)}
  // rim shading + warm bounce light from the counter
  g=X.createRadialGradient(cx,cy,R*.45,cx,cy,R*1.12);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${m.jelly?.25:.38})`);
  X.fillStyle=g;X.fillRect(cx-pad,cy-pad,pad*2,pad*2);
  g=X.createLinearGradient(0,b.maxY,0,b.maxY-R*.6);g.addColorStop(0,'rgba(255,170,100,.2)');g.addColorStop(1,'rgba(255,170,100,0)');
  X.fillStyle=g;X.fillRect(cx-pad,b.maxY-R*.6,pad*2,R*.6);
  // specular highlight
  const sx=cx-R*.33,sy=cy-R*.42,sp=m.spec*(b.chunk?.7:1);
  X.save();X.translate(sx,sy);X.rotate(-.6);X.scale(1,.62);
  g=X.createRadialGradient(0,0,0,0,0,R*.36);g.addColorStop(0,`rgba(255,255,255,${sp*.8})`);g.addColorStop(.4,`rgba(255,255,255,${sp*.25})`);g.addColorStop(1,'rgba(255,255,255,0)');
  X.fillStyle=g;X.beginPath();X.arc(0,0,R*.36,0,TAU);X.fill();X.restore();
  X.fillStyle=`rgba(255,255,255,${sp})`;X.beginPath();X.ellipse(sx-R*.04,sy-R*.02,R*.07,R*.045,-.6,0,TAU);X.fill();
  if(m.jelly){X.fillStyle='rgba(255,255,255,.5)';X.beginPath();X.ellipse(cx+R*.45,cy-R*.1,R*.04,R*.12,.3,0,TAU);X.fill()}
  X.restore();
  // stem / navel
  if(m.stem&&!b.chunk)for(let i=0;i<p.length;i++)if(p[i].stem)drawStem(b,p[i]);
}
function drawCuts(b){
  const p=b.pts,n=p.length,m=b.m,w=b.tex.R*(m.rind?1.5:1.25);
  let start=-1;for(let i=0;i<n;i++)if(!p[i].cut){start=i;break}
  if(start<0)start=0;
  const runs=[];let cur=null;
  for(let k=1;k<=n;k++){const i=(start+k)%n;if(p[i].cut){if(!cur){cur=[];runs.push(cur)}cur.push(p[i])}else cur=null}
  for(const r of runs){if(r.length<2)continue;
    X.lineJoin='round';X.lineCap='round';
    const line=(lw,c,a=1)=>{X.globalAlpha=a;X.strokeStyle=c;X.lineWidth=lw;X.beginPath();X.moveTo(r[0].x,r[0].y);for(let i=1;i<r.length;i++)X.lineTo(r[i].x,r[i].y);X.stroke()};
    if(m.rind){line(w,'#e9f0c4');line(w*.86,m.fleshDk);line(w*.7,m.flesh);line(w*.25,m.fleshHi,.6)}
    else if(m.jelly){line(w*.5,'rgba(220,255,180,.35)')}
    else{line(w,m.fleshDk);line(w*.75,m.flesh);line(w*.3,m.fleshHi,.7)}
    X.globalAlpha=1;
    // inward normal for seeds / segments
    const a=r[0],z=r[r.length-1],L=Math.hypot(z.x-a.x,z.y-a.y)||1,nx=(z.y-a.y)/L,ny=-(z.x-a.x)/L;
    const sg=((b.cx-a.x)*nx+(b.cy-a.y)*ny)>0?1:-1;
    for(const q of r){
      if(m.seed==='#000')continue;
      if(b.type==='orange'){X.strokeStyle='rgba(255,245,210,.55)';X.lineWidth=1;X.beginPath();X.moveTo(q.x,q.y);X.lineTo(q.x+nx*sg*w*.42,q.y+ny*sg*w*.42);X.stroke();continue}
      if(q.s1<.55){const d=w*(.12+q.s2*.3),x=q.x+nx*sg*d,y=q.y+ny*sg*d;
        if(m.rind){X.fillStyle=m.seed;X.beginPath();X.ellipse(x,y,3.2,1.8,Math.atan2(ny,nx),0,TAU);X.fill();X.fillStyle='rgba(255,255,255,.4)';X.fillRect(x-1,y-1,1.2,1)}
        else{X.fillStyle='rgba(255,200,120,.35)';X.beginPath();X.arc(x,y,4,0,TAU);X.fill();X.fillStyle=m.seed;X.beginPath();X.ellipse(x,y,2,1.3,q.s1*9,0,TAU);X.fill()}}
    }
    // wet gloss on the cut
    X.globalAlpha=.35;X.strokeStyle='#fff';X.lineWidth=1.2;X.beginPath();X.moveTo(r[0].x,r[0].y);for(let i=1;i<r.length;i++)X.lineTo(r[i].x,r[i].y);X.stroke();X.globalAlpha=1;
  }
}
function drawStem(b,q){
  const dx=q.x-b.cx,dy=q.y-b.cy,l=Math.hypot(dx,dy)||1,ux=dx/l,uy=dy/l,a=Math.atan2(uy,ux);
  X.save();X.translate(q.x-ux*2,q.y-uy*2);X.rotate(a+Math.PI/2);
  if(b.type==='orange'){X.fillStyle='#6b4a1a';X.beginPath();X.ellipse(0,1,3.2,2.2,0,0,TAU);X.fill();X.fillStyle='#3e5a14';X.beginPath();X.arc(0,1,1.5,0,TAU);X.fill();X.restore();return}
  X.fillStyle='#2f6b1c';X.strokeStyle='#1c4410';X.lineWidth=.8;
  for(let k=0;k<5;k++){X.save();X.rotate(-1.25+k*.62);X.beginPath();X.moveTo(0,0);X.quadraticCurveTo(3.5,4,0,13);X.quadraticCurveTo(-3.5,4,0,0);X.fill();X.stroke();X.restore()}
  X.fillStyle='#3d7d22';X.fillRect(-1.6,-7,3.2,8);X.fillStyle='#5a9a34';X.fillRect(-1.6,-7,1.2,8);
  X.restore();
}
function drawDrops(){
  for(const d of drops){
    if(d.k==='shell'){X.save();X.translate(d.x,d.y);X.rotate(d.r);X.strokeStyle='#efe0c6';X.lineWidth=2.4;X.beginPath();X.arc(0,d.s,d.s*1.4,-2.1,-1.1);X.stroke();
      X.strokeStyle='#fffdf6';X.lineWidth=1;X.beginPath();X.arc(0,d.s,d.s*1.4-1,-2,-1.2);X.stroke();X.restore();continue}
    if(d.k==='seed'){X.save();X.translate(d.x,d.y);X.rotate(d.r);X.fillStyle=d.c;X.beginPath();X.ellipse(0,0,d.s*1.4,d.s*.8,0,0,TAU);X.fill();X.restore();continue}
    X.globalAlpha=.9*d.a;X.fillStyle=d.c;X.beginPath();
    const sp=Math.hypot(d.vx,d.vy),st=1+Math.min(sp*.08,1.2);
    X.ellipse(d.x,d.y,d.s*st,d.s/Math.sqrt(st),Math.atan2(d.vy,d.vx),0,TAU);X.fill();
    X.globalAlpha=.6*d.a;X.fillStyle='#fff';X.beginPath();X.arc(d.x-d.s*.3,d.y-d.s*.3,d.s*.3,0,TAU);X.fill();
  }
  X.globalAlpha=1;
}
function drawTrail(){
  const now=performance.now();ptr.trail=ptr.trail.filter(t=>now-t.t<140);
  const t=ptr.trail;if(t.length<2)return;
  X.lineCap='round';
  for(let i=1;i<t.length;i++){const a=1-(now-t[i].t)/140;X.strokeStyle=`rgba(235,245,255,${a*.85})`;X.lineWidth=1+a*4;X.beginPath();X.moveTo(t[i-1].x,t[i-1].y);X.lineTo(t[i].x,t[i].y);X.stroke()}
}
function drawFx(){for(const f of fx){const a=1-f.t/18;X.strokeStyle=`rgba(255,240,220,${a*.6})`;X.lineWidth=3*a;X.beginPath();X.ellipse(f.x,f.y,20+f.t*4,(20+f.t*4)*.55,0,0,TAU);X.stroke()}}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);X=ctx;
  const s=reduce?0:shake;ctx.translate(rnd(-s,s)*.5,rnd(-s,s)*.5);
  ctx.drawImage(bg,0,0,W,H);ctx.drawImage(st,0,0,W,H);
  for(const b of bodies){aabb(b);drawShadow(b)}
  for(const b of bodies)drawBody(b);
  drawDrops();drawFx();if(tool==='knife')drawTrail();
}

/* ---------- audio & haptics ---------- */
let AC=null,NB=null,muted=false,sndBudget=0;
function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate;NB=AC.createBuffer(1,n,n);const d=NB.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
function ok(){if(!AC||muted||sndBudget>4)return false;sndBudget++;if(AC.state==='suspended')AC.resume();return true}
function noise(dur,type,f0,f1,vol,q=1){if(!ok())return;const t=AC.currentTime,s=AC.createBufferSource();s.buffer=NB;s.playbackRate.value=rnd(.7,1.3);
  const f=AC.createBiquadFilter();f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.001,vol),t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(AC.destination);s.start(t,rnd(0,.5));s.stop(t+dur+.05)}
function thump(f0,f1,dur,vol){if(!ok())return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02)}
const sfx={
  squish:v=>noise(.16,'lowpass',rnd(900,1500),160,v*.55,3),
  splat:v=>{noise(.4,'lowpass',2800,140,v*.9,1);thump(130,38,.22,v*.8);noise(.3,'bandpass',1200,250,v*.5,4)},
  cut:()=>noise(.09,'highpass',2400,7000,.22,.7),
  crack:()=>{for(let k=0;k<4;k++)setTimeout(()=>noise(.035,'highpass',2600,5200,.35,1),k*22)},
  bonk:v=>{thump(95,42,.16,v*.9);noise(.06,'lowpass',800,200,v*.3)},
};
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

/* ---------- UI ---------- */
document.querySelectorAll('.tool').forEach(btn=>btn.addEventListener('click',()=>{tool=btn.dataset.tool;
  document.querySelectorAll('.tool').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)))}));
const sndBtn=document.getElementById('snd');
sndBtn.addEventListener('click',()=>{audioInit();muted=!muted;document.getElementById('wave').hidden=muted;document.getElementById('xmark').hidden=!muted;sndBtn.setAttribute('aria-label',muted?'Ton einschalten':'Ton ausschalten')});
document.getElementById('clean').addEventListener('click',()=>{
  stx.clearRect(0,0,W,H);drops=drops.filter(d=>d.k==='drop');drips=[];mess=0;
  bodies=bodies.filter(b=>!b.chunk&&b.type!=='yolk');
});
const tray=document.getElementById('tray');
FOODS.forEach(type=>{
  const btn=document.createElement('button');btn.className='food';btn.setAttribute('aria-label',M[type].label+' holen');
  const c=document.createElement('canvas');c.width=c.height=88;const g=c.getContext('2d');
  const b=makeBody(type,0,0);aabb(b);const s=36/Math.max(b.maxX-b.minX,b.maxY-b.minY);
  for(const p of b.pts){p.x*=s;p.y*=s}b.R*=s;b.tex=makeTex(b.tex.R*s);b.cx=0;b.cy=0;aabb(b);
  g.scale(2,2);g.translate(22,22+(type==='tomato'||type==='orange'?2:0));X=g;drawBody(b);X=ctx;
  const l=document.createElement('span');l.textContent=M[type].label;
  btn.append(c,l);tray.append(btn);
  btn.addEventListener('click',()=>{audioInit();hideHint();spawn(type)});
});
function spawn(type,x){
  const m=M[type],r=m.r;x=x??clamp(W*.5+rnd(-W*.28,W*.28),r*1.4,W-r*1.4);
  const lift=type==='egg'?18:rnd(70,120);
  add(makeBody(type,x,floorY-r-lift,{vx:rnd(-1,1),vr:rnd(-.01,.01)}));sfx.squish(.1);
}
const hint=document.getElementById('hint');let hintOn=true;
function hideHint(){if(hintOn){hintOn=false;hint.style.opacity='0'}}
const messEl=document.getElementById('mess'),barEl=document.getElementById('mbar');
function updMess(){const v=Math.min(100,Math.round(mess/(W*H*.012)*100));messEl.textContent=v+'%';barEl.style.width=v+'%'}

/* ---------- sizing & loop ---------- */
function resize(){
  const r=cv.getBoundingClientRect(),oW=W,oH=H;
  let old=null;if(oW){old=document.createElement('canvas');old.width=st.width;old.height=st.height;old.getContext('2d').drawImage(st,0,0)}
  W=r.width;H=r.height;DPR=Math.min(2,window.devicePixelRatio||1);
  for(const c of[cv,bg,st]){c.width=Math.round(W*DPR);c.height=Math.round(H*DPR)}
  counterTop=H*.7;counterFront=H*.83;floorY=H*.765;
  stx.setTransform(DPR,0,0,DPR,0,0);if(old)stx.drawImage(old,0,0,oW,oH);
  drawBg();
}
addEventListener('resize',resize);resize();

// opening scene
{const half={melon:80,jelly:42,tomato:39,egg:21,orange:36},order=['melon','jelly','tomato','egg','orange'],gap=12;
  const pick=[];let used=gap;for(const t of order){if(used+half[t]*2+gap<=W){pick.push(t);used+=half[t]*2+gap}}
  let x=(W-used)/2+gap;for(const t of pick){const m=M[t],b=add(makeBody(t,x+half[t],floorY-m.r*(t==='egg'?1.02:.92)-1));b.inv=120;x+=half[t]*2+gap}}
for(let i=0;i<90;i++)step();

let last=performance.now(),acc=0,tick=0;
function loop(t){
  acc+=Math.min(60,t-last);last=t;let n=0;
  while(acc>=1000/60&&n<3){sndBudget=0;step();acc-=1000/60;n++}
  render();if(++tick%10===0)updMess();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
