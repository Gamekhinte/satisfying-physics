<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Squish Kitchen</title>
<meta name="theme-color" content="#141917">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Squish Kitchen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Familjen+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one full-screen kitchen (canvas) with a slim top bar and one bottom bar (tools + food tray). Single dark look by choice. */
:root{
  --bg:#141917;
  --panel:rgba(18,22,20,.8);
  --line:rgba(255,236,210,.14);
  --fg:#f6ead8;
  --muted:#b9a993;
  --accent:#ff5a3c;
  --display:"Shrikhand","Georgia",serif;
  --ui:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
canvas#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.logo{font-family:var(--display);font-size:19px;line-height:.95;color:var(--fg);text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 18px rgba(255,90,60,.35);transform:rotate(-3deg)}
.top .right{display:flex;gap:6px;align-items:center;pointer-events:auto}
.meter{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:7px;align-items:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.meter b{color:var(--fg);font-variant-numeric:tabular-nums;font-size:13px;letter-spacing:0;min-width:3.2ch;text-align:right}
.bar{width:30px;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb000,var(--accent))}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:700 13px var(--ui);border-radius:999px;padding:7px 11px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer}
.btn.icon{padding:6px 8px;display:grid;place-items:center}
.btn svg{width:18px;height:18px;display:block}
.btn:focus-visible,.tool:focus-visible,.food:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bottom{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;
  padding:0 max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));pointer-events:none}
.dock{pointer-events:auto;display:flex;align-items:stretch;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);max-width:100%;min-width:0}
.tools{display:flex;flex-direction:column;gap:3px;flex:none}
.tool{appearance:none;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;width:40px;flex:1;min-height:20px;border-radius:12px;cursor:pointer;padding:0}
.tool svg{width:19px;height:19px}
.tool[aria-pressed="true"]{background:var(--fg);color:#1a1512}
.sep{width:1px;background:var(--line);margin:4px 2px;flex:none}
.tray{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.tray::-webkit-scrollbar{display:none}
.cat{writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);opacity:.7;padding:6px 0;flex:none;text-align:center}
.food{appearance:none;border:0;background:transparent;color:var(--muted);font:500 11px var(--ui);display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 4px 3px;border-radius:12px;cursor:pointer;min-width:56px;flex:none;scroll-snap-align:start}
.food:active{background:rgba(255,255,255,.1)}
.food canvas{width:44px;height:44px}
.toast{position:absolute;left:50%;top:calc(50px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;line-height:1.35;color:var(--fg);pointer-events:none;transition:opacity .5s;text-align:center;max-width:calc(100% - 32px);width:max-content;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
@media (min-width:700px){.logo{font-size:24px}.food canvas{width:50px;height:50px}.tool{width:46px}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c" aria-label="Küche zum Spielen mit Essen"></canvas>
  <div class="top">
    <div class="logo">Squish<br>Kitchen</div>
    <div class="right">
      <div class="meter" title="Wie dreckig die Küche ist">Sauerei <span class="bar"><i id="mbar"></i></span><b id="mess">0%</b></div>
      <button class="btn icon" id="snd" aria-label="Ton ausschalten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z"/><path id="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path id="xmark" d="M16 10l5 5M21 10l-5 5" hidden/></svg></button>
      <button class="btn" id="clean">Putzen</button>
    </div>
  </div>
  <div class="toast" id="toast">Tippe auf ein Essen unten. Zieh es in Pfanne, Topf, Ofen oder Mikrowelle und dreh die Knöpfe auf.</div>
  <div class="bottom">
    <div class="dock">
      <div class="tools" role="group" aria-label="Werkzeug">
        <button class="tool" data-tool="hand" aria-pressed="true" aria-label="Greifen und werfen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5V4a1.5 1.5 0 0 1 3 0v7m0-5.5a1.5 1.5 0 0 1 3 0V12m0-3.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-4.6-2.2L4.4 15.6a1.6 1.6 0 0 1 2.4-2.1L8 14.8"/></svg></button>
        <button class="tool" data-tool="knife" aria-pressed="false" aria-label="Messer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l7.5-7.5"/><path d="M10.5 13.5L20 4c1 3-1 9-7 11.5z"/></svg></button>
        <button class="tool" data-tool="mallet" aria-pressed="false" aria-label="Fleischklopfer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="12" height="7" rx="1.5" transform="rotate(45 15 6)"/><path d="M11.5 12.5L3.5 20.5"/></svg></button>
      </div>
      <div class="sep"></div>
      <div class="tray" id="tray" aria-label="Essen holen"></div>
    </div>
  </div>
</div>

<script>
(()=>{
'use strict';
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const bg=document.createElement('canvas'), bgx=bg.getContext('2d');
const st=document.createElement('canvas'), stx=st.getContext('2d');
let W=0,H=0,DPR=1,floorY=0,counterTop=0,counterFront=0;
let X=ctx;
const G=0.42, TAU=Math.PI*2, ROOM=20;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;

/* ================= colours ================= */
const hcache={};
function rgb(c){if(hcache[c])return hcache[c];const h=c.replace('#','');return hcache[c]=[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function mix(a,b,t){const A=rgb(a),B=rgb(b);t=clamp(t,0,1);return'#'+[0,1,2].map(i=>Math.round(A[i]+(B[i]-A[i])*t).toString(16).padStart(2,'0')).join('')}
const BURNT=['#4a3020','#24160c','#0c0604'];

/* ================= shapes ================= */
function param(fn,m=96){const o=[];for(let i=0;i<m;i++)o.push(fn(i/m*TAU));return o}
function rrect(w,h,r){const o=[],hw=w/2,hh=h/2;r=Math.min(r,hw,hh);
  for(const[cx,cy,a0]of[[hw-r,hh-r,0],[-hw+r,hh-r,Math.PI/2],[-hw+r,-hh+r,Math.PI],[hw-r,-hh+r,Math.PI*1.5]])
    for(let i=0;i<=8;i++){const a=a0+i/8*Math.PI/2;o.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}return o}
function resample(poly,n){
  const m=poly.length,L=[];let tot=0;
  for(let i=0;i<m;i++){const a=poly[i],b=poly[(i+1)%m],d=Math.hypot(b[0]-a[0],b[1]-a[1]);L.push(d);tot+=d}
  const out=[];let seg=0,acc=0;
  for(let k=0;k<n;k++){const target=k/n*tot;while(seg<m-1&&acc+L[seg]<target){acc+=L[seg];seg++}
    const t=L[seg]?(target-acc)/L[seg]:0,a=poly[seg],b=poly[(seg+1)%m];out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}
  return out}
const SH={
  circle:r=>param(t=>[r*Math.cos(t),r*Math.sin(t)]),
  tomato:r=>param(t=>{const k=1+.035*Math.cos(5*t);return[r*1.04*Math.cos(t)*k,r*.88*Math.sin(t)*k]}),
  orange:r=>param(t=>[r*Math.cos(t),r*.97*Math.sin(t)]),
  egg:r=>param(t=>{const s=Math.sin(t);return[r*.8*Math.cos(t)*(1+.13*s),r*1.02*s]}),
  jelly:r=>param(t=>{const c=Math.cos(t),s=Math.sin(t),e=.42;return[r*1.05*Math.sign(c)*Math.abs(c)**e,r*.92*Math.sign(s)*Math.abs(s)**e]}),
  melon:r=>param(t=>[r*1.25*Math.cos(t),r*.92*Math.sin(t)]),
  strawberry:r=>param(t=>{const c=Math.cos(t),s=Math.sin(t),lo=Math.max(0,s);return[r*.95*c*(1-.5*lo*lo),r*(s>0?1.2:.72)*s]}),
  banana:r=>{const A=r*2.3,span=.8,outer=[],inner=[];
    for(let i=0;i<=24;i++){const u=i/24*2-1,ph=u*span,cx=A*Math.sin(ph),cy=-A+A*Math.cos(ph),nx=Math.sin(ph),ny=Math.cos(ph),w=r*.42*(1-.7*u*u)+r*.1;
      outer.push([cx+nx*w,cy+ny*w]);inner.push([cx-nx*w*.85,cy-ny*w*.85])}
    const e=outer[24],f=inner[24],tip=[(e[0]+f[0])/2+r*.32,(e[1]+f[1])/2-r*.2];
    return[...outer,tip,...inner.reverse()]},
  bar:r=>rrect(r*2.7,r*1.0,3),
  butter:r=>rrect(r*2,r*1.15,3),
  mallow:r=>rrect(r*1.7,r*1.6,r*.55),
  cheese:r=>[[-1.45*r,.5*r],[1.15*r,.5*r],[1.15*r,-.62*r],[1.05*r,-.62*r]],
  steak:r=>param(t=>{const k=1+.08*Math.sin(3*t+1)+.05*Math.sin(5*t);return[r*1.55*Math.cos(t)*k,r*.55*Math.sin(t)*k]}),
  sausage:r=>rrect(r*3.3,r*.95,r*.47),
  dough:r=>param(t=>{const s=Math.sin(t);return[r*1.25*Math.cos(t),r*(s>0?.55:.8)*s]}),
  kernel:r=>param(t=>{const s=Math.sin(t);return[r*.85*Math.cos(t)*(1-.3*Math.max(0,s)),r*1.1*s]},32),
  popcorn:(r,sd)=>param(t=>{const k=1+.22*Math.sin(3*t+sd)+.14*Math.sin(5*t+sd*2)+.08*Math.sin(7*t+sd*3);return[r*Math.cos(t)*k,r*.9*Math.sin(t)*k]}),
  eggwhite:r=>param(t=>{const k=1+.1*Math.sin(3*t+1)+.05*Math.sin(5*t);return[r*1.45*Math.cos(t)*k,r*.24*Math.sin(t)*k]}),
  blob:(r,sd)=>param(t=>{const k=1+.2*Math.sin(t*3+sd)+.1*Math.sin(t*5+sd*2);return[r*Math.cos(t)*k,r*Math.sin(t)*k]}),
  shard:r=>{const k=5+(Math.random()*2|0),a=[];for(let i=0;i<k;i++)a.push(i/k*TAU+rnd(-.3,.3));return a.map(t=>[Math.cos(t)*r*rnd(.65,1.1),Math.sin(t)*r*rnd(.65,1.1)])},
};

/* ================= materials ================= */
const D={k:.3,edge:.6,press:.6,thresh:12,frag:4,squeeze:2,plastic:0,bounce:.15,fric:.8,hammer:1,heat:.006,dens:1,spec:.6,chunks:3,cookT:100,cookSec:10,seed:'#000'};
const M={

    skin:['#8c5838','#5a3220','#2a160c'],flesh:'#6a3c24',fleshHi:'#8a5434',fleshDk:'#4a2414',juice:'#4a2414',cookT:150,cookSec:6,melt:{T:38}},
  mallow:{label:'Marshmallow',cat:'sweet',shape:'mallow',r:17,n:20,k:.14,edge:.4,press:.9,thresh:999,frag:0,squeeze:0,bounce:.45,hammer:.6,heat:.014,dens:.4,spec:.25,chunks:3,
    skin:['#ffffff','#f6efea','#cbbcb4'],cooked:['#f6d29a','#d08a44','#7a4416'],flesh:'#fffaf6',fleshHi:'#ffffff',fleshDk:'#efe4dc',juice:'#fff8f0',cookT:120,cookSec:4,rise:{T:70,max:1.3}},
  strawberry:{label:'Erdbeere',cat:'sweet',shape:'strawberry',r:19,n:20,k:.3,thresh:13,frag:5,squeeze:3,plastic:.01,hammer:1.4,heat:.008,spec:.75,chunks:3,stem:'top',leaf:true,
    skin:['#ff5a6a','#d8102c','#6a0414'],flesh:'#ff7a8c',fleshHi:'#fff0f0',fleshDk:'#e0304a',juice:'#d0102a',seedDots:'#f8e070'},
  banana:{label:'Banane',cat:'sweet',shape:'banana',r:20,n:30,k:.35,edge:.6,thresh:14,frag:4,squeeze:2.5,plastic:.015,hammer:1.1,heat:.007,spec:.45,chunks:3,stem:'right',
    skin:['#fff27a','#f0c818','#8a6a08'],cooked:['#d8a03a','#9a6416','#4a2a08'],flesh:'#fff1c0',fleshHi:'#fffbe8',fleshDk:'#efdc9c',juice:'#f6e6a8',seed:'#6a4a26',cookT:60,cookSec:8},
  jelly:{label:'Pudding',cat:'sweet',shape:'jelly',r:36,n:28,k:.05,edge:.22,press:1,thresh:999,frag:0,squeeze:0,bounce:.3,fric:.75,hammer:.45,heat:0,spec:1,chunks:6,jelly:true,
    skin:['rgba(190,255,150,.9)','rgba(50,200,70,.82)','rgba(8,95,35,.9)'],flesh:'rgba(60,210,80,.85)',fleshHi:'rgba(190,255,150,.9)',fleshDk:'rgba(8,95,35,.9)',juice:'#3cc24a'},
  melon:{label:'Melone',cat:'sweet',shape:'melon',r:50,n:32,k:.55,edge:.7,press:.5,thresh:16,frag:3.5,squeeze:1.2,plastic:.004,bounce:.12,fric:.85,hammer:.55,heat:.002,dens:1.1,spec:.45,chunks:5,stripes:true,rind:true,
    skin:['#6fb94b','#2e6f1d','#0f300a'],flesh:'#f2384c',fleshHi:'#ff8f96',fleshDk:'#b8182b',juice:'#e0283f',seed:'#1b120e'},
  orange:{label:'Orange',cat:'sweet',shape:'orange',r:30,n:22,k:.45,edge:.7,press:.5,thresh:18,frag:3.2,squeeze:1.5,plastic:.005,bounce:.25,fric:.85,hammer:.75,heat:.004,spec:.5,chunks:3,stem:'navel',dimples:true,

  kernel:{label:'Popcorn',cat:'sweet',shape:'kernel',r:5.5,n:8,k:.9,edge:1,press:.2,thresh:999,frag:0,squeeze:0,bounce:.35,hammer:.2,heat:.03,dens:1.3,spec:.8,chunks:0,
    skin:['#ffe070','#eaa412','#8a5000'],flesh:'#fff8e0',fleshHi:'#ffffff',fleshDk:'#f0e0b0',juice:'#ffffff',pop:172},
  popcorn:{label:'Popcorn',cat:'none',shape:'popcorn',r:12,n:14,k:.32,edge:.5,press:.6,thresh:999,frag:0,squeeze:0,bounce:.4,hammer:1.6,heat:.02,dens:.25,spec:.3,chunks:2,

  // savoury
  tomato:{label:'Tomate',cat:'savory',shape:'tomato',r:32,n:22,k:.2,edge:.5,press:.7,thresh:10.5,frag:5.5,squeeze:3,plastic:.02,bounce:.12,hammer:1.3,heat:.006,spec:.8,chunks:3,stem:'top',leaf:true,

  sausage:{label:'Würstchen',cat:'savory',shape:'sausage',r:20,n:26,k:.5,edge:.8,press:.5,thresh:22,frag:2,squeeze:1,bounce:.2,hammer:.5,heat:.007,spec:.7,chunks:3,

  cheese:{label:'Käse',cat:'savory',shape:'cheese',r:22,n:24,k:.6,edge:.8,press:.4,thresh:18,frag:3,squeeze:1,plastic:.005,hammer:.8,heat:.01,spec:.35,chunks:3,holes:true,

/* ================= physics ================= */
function shapeMatch(b,k,first){
  const p=b.pts,q=b.rest,n=p.length;let cx=0,cy=0;
  for(const a of p){cx+=a.x;cy+=a.y}cx/=n;cy/=n;
  let s=0,c=0;for(let i=0;i<n;i++){const dx=p[i].x-cx,dy=p[i].y-cy;c+=q[i].x*dx+q[i].y*dy;s+=q[i].x*dy-q[i].y*dx}
  const a=Math.atan2(s,c),co=Math.cos(a),si=Math.sin(a);b.rot=a;b.cx=cx;b.cy=cy;
  const pl=first?b.pl:0,lim=b.R*.1;
  for(let i=0;i<n;i++){const r=q[i],gx=cx+r.x*co-r.y*si,gy=cy+r.x*si+r.y*co;
    if(pl){const dx=p[i].x-cx,dy=p[i].y-cy,lx=dx*co+dy*si,ly=-dx*si+dy*co,ex=lx-r.x,ey=ly-r.y;
      if(ex*ex+ey*ey>lim*lim){r.x+=ex*pl;r.y+=ey*pl}}
    p[i].x+=(gx-p[i].x)*k;p[i].y+=(gy-p[i].y)*k}
}
function edges(b){
  const p=b.pts,n=p.length,s=b.ee*.5;
  for(let i=0;i<n;i++){const a=p[i],c=p[(i+1)%n],dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy)||1e-6,f=(d-b.L[i])/d*s;
    a.x+=dx*f;a.y+=dy*f;c.x-=dx*f;c.y-=dy*f}
}
function pressure(b){
  const p=b.pts,n=p.length,A=polyArea(p),diff=(b.restArea-A)/b.restArea;
  if(Math.abs(diff)<.002)return;const f=diff*b.m.press*b.R*.12;
  for(let i=0;i<n;i++){const pr=p[(i+n-1)%n],nx=p[(i+1)%n],tx=nx.x-pr.x,ty=nx.y-pr.y,l=Math.hypot(tx,ty)||1;
    p[i].x+=ty/l*f;p[i].y+=-tx/l*f}
}
function bounds(b,first){
  const m=b.m;
  for(const p of b.pts){
    if(p.y>floorY){const v=p.y-p.py;if(first&&v>b.imp)b.imp=v;p.y=floorY;const vx=p.x-p.px;p.px=p.x-vx*m.fric;p.py=p.y+Math.max(0,v)*m.bounce}
    if(p.x<2){const v=p.px-p.x;if(first&&v>b.imp)b.imp=v;p.x=2;p.px=p.x-Math.max(0,v)*m.bounce}
    else if(p.x>W-2){const v=p.x-p.px;if(first&&v>b.imp)b.imp=v;p.x=W-2;p.px=p.x+Math.max(0,v)*m.bounce}
    if(p.y<-300){p.y=-300;p.py=p.y}
  }
}
function segHit(b,first){
  const m=b.m;
  for(const s of segs){
    if(s.on&&!s.on())continue;
    const mnx=Math.min(s.ax,s.bx)-s.r,mxx=Math.max(s.ax,s.bx)+s.r,mny=Math.min(s.ay,s.by)-s.r,mxy=Math.max(s.ay,s.by)+s.r;
    if(b.maxX<mnx-20||b.minX>mxx+20||b.maxY<mny-20||b.minY>mxy+20)continue;
    const ex=s.bx-s.ax,ey=s.by-s.ay,l2=ex*ex+ey*ey,L=Math.sqrt(l2);
    for(const p of b.pts){
      if(p.x<mnx-30||p.x>mxx+30||p.y<mny-30||p.y>mxy+30)continue;
      const t=clamp(((p.x-s.ax)*ex+(p.y-s.ay)*ey)/l2,0,1),qx=s.ax+ex*t,qy=s.ay+ey*t;
      const sn=ex*(p.y-s.ay)-ey*(p.x-s.ax),sp=ex*(p.py-s.ay)-ey*(p.px-s.ax);
      const dx=p.x-qx,dy=p.y-qy,d=Math.hypot(dx,dy);
      let crossed=false;
      if(sn*sp<0)crossed=!!segInt(p.px,p.py,p.x,p.y,s.ax,s.ay,s.bx,s.by);
      if(d>=s.r&&!crossed)continue;

      else{nx=-ey/L;ny=ex/L;if(sp<0||(sp===0&&sn<0)){nx=-nx;ny=-ny}}
      const pen=s.r-((p.x-qx)*nx+(p.y-qy)*ny);if(pen<=0)continue;
      const v0=(p.x-p.px)*nx+(p.y-p.py)*ny;if(first&&-v0>b.imp)b.imp=-v0;
      p.x+=nx*pen;p.y+=ny*pen;
      const vx=p.x-p.px,vy=p.y-p.py,vn=vx*nx+vy*ny;
      if(vn<0){const tx=vx-vn*nx,ty=vy-vn*ny,f=m.fric;

    }

}
function aabb(b){let a=1e9,c=-1e9,d=1e9,e=-1e9;for(const p of b.pts){if(p.x<a)a=p.x;if(p.x>c)c=p.x;if(p.y<d)d=p.y;if(p.y>e)e=p.y}b.minX=a;b.maxX=c;b.minY=d;b.maxY=e}
function inside(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];if((a.y>y)!==(b.y>y)&&x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)c=!c}return c}
function pushPoints(a,b,first){
  const bp=b.pts,n=bp.length,ma=a.restArea*a.m.dens,mb=b.restArea*b.m.dens,wa=mb/(ma+mb),wb=1-wa;
  for(const p of a.pts){
    if(p.x<b.minX||p.x>b.maxX||p.y<b.minY||p.y>b.maxY||!inside(p.x,p.y,bp))continue;
    let best=1e18,bj=0,bt=0,qx=0,qy=0;
    for(let j=0;j<n;j++){const e0=bp[j],e1=bp[(j+1)%n],ex=e1.x-e0.x,ey=e1.y-e0.y;
      const t=clamp(((p.x-e0.x)*ex+(p.y-e0.y)*ey)/(ex*ex+ey*ey||1),0,1),x=e0.x+ex*t,y=e0.y+ey*t,d=(x-p.x)**2+(y-p.y)**2;

    if(first){const rv=Math.hypot((p.x-p.px)-(e0.x-e0.px),(p.y-p.py)-(e0.y-e0.py))*.75;if(rv>a.imp)a.imp=rv;if(rv>b.imp)b.imp=rv}
    p.x+=dx*wa;p.y+=dy*wa;
    e0.x-=dx*wb*(1-bt);e0.y-=dy*wb*(1-bt);e1.x-=dx*wb*bt;e1.y-=dy*wb*bt;
    const fx=(p.x-p.px)*.05,fy=(p.y-p.py)*.05;p.px+=fx;p.py+=fy;
    if(first){const dT=(b.T-a.T)*.004;a.T+=dT;b.T-=dT}

}
function segInt(ax,ay,bx,by,cx,cy,dx,dy){const r1=bx-ax,r2=by-ay,s1=dx-cx,s2=dy-cy,den=r1*s2-r2*s1;if(Math.abs(den)<1e-9)return null;

/* ================= heat & cooking ================= */
const LEVELS=[ROOM,185,265];
function heatSource(b){
  const w=where(b);
  if(w==='pan')return[pan.T,1];
  if(w==='pot')return[pot.T,.9];
  if(w==='oven')return oven.open?[lerp(ROOM,oven.T,.4),.3]:[oven.T,.65];
  if(w==='micro')return(!micro.open&&micro.lvl)?[b.m.pop?215:130,1.8]:[micro.T,.3];
  return[ROOM,.12];
}
function cookStep(b){
  const m=b.m;if(!m.heat)return false;
  const[tt,rate]=heatSource(b);
  b.T+=(tt-b.T)*m.heat*rate;
  if(m.cookSec){const over=b.T-m.cookT;if(over>0)b.cook=Math.min(2.4,b.cook+clamp(over/100,0,1.6)/(m.cookSec*60))}
  if(m.melt){if(b.T>m.melt.T)b.melt=Math.min(1,b.melt+(b.T-m.melt.T)*.00035);else if(b.T<m.melt.T-6)b.melt=Math.max(0,b.melt-.0015)}
  if(m.rise&&b.T>m.rise.T&&b.grow<m.rise.max){const f=1.0012;b.grow*=f;for(const r of b.rest){r.x*=f;r.y*=f}for(let i=0;i<b.L.length;i++)b.L[i]*=f;b.restArea*=f*f;b.R*=f}
  let k=lerp(m.k,.008,b.melt),e=lerp(m.edge,.05,b.melt),pl=b.melt>.15?lerp(m.plastic,.06,b.melt):m.plastic;
  if(m.rise&&b.cook>.55){k=Math.max(k,.32);pl=0}
  if(b.type==='eggwhite'){k=lerp(.06,.35,clamp(b.cook,0,1));pl=b.cook>.6?0:m.plastic}
  b.ke=k;b.ee=e;b.pl=pl;
  if(b.T>92&&Math.random()<.05+(b.T-92)*.001)puff(b.cx+rnd(-b.R*.5,b.R*.5),b.minY,'steam');
  if(b.cook>1.45&&Math.random()<(b.cook-1.45)*.25)puff(b.cx+rnd(-b.R*.4,b.R*.4),b.minY,'smoke');
  if(b.melt>.55&&Math.random()<.01*b.melt){let lo=b.pts[0];for(const p of b.pts)if(p.y>lo.y)lo=p;drop(lo.x,lo.y+1,rnd(-.3,.3),.5,m.juice,rnd(1.5,3),.9)}
  if(m.pop&&b.T>m.pop+b.popAt*.6){popKernel(b);return true}
  if(m.boom&&b.cook<.5&&where(b)==='micro'&&b.T>m.boom){burst(b,false,true);return true}
  if(m.splitAt&&b.cook>m.splitAt&&!b.chunk&&!b.split&&Math.random()<.01){b.split=true;const c={x:b.cx,y:b.cy},a=b.rot+Math.PI/2+rnd(-.3,.3);
    cut(b,{x:c.x+Math.cos(a)*b.R*3,y:c.y+Math.sin(a)*b.R*3},{x:c.x-Math.cos(a)*b.R*3,y:c.y-Math.sin(a)*b.R*3},true);sfx.pop(.4);return true}
  return false;
}
function popKernel(b){
  remove(b);const[vx]=bodyVel(b);
  const pc=add(makeBody('popcorn',b.cx,b.cy-4,{r:rnd(10,13.5),vx:vx+rnd(-2.5,2.5),vy:rnd(-9,-5),vr:rnd(-.05,.05)}));
  pc.T=b.T;pc.inv=10;
  for(let i=0;i<3;i++)drops.push({k:'crumb',x:b.cx,y:b.cy,vx:rnd(-2,2),vy:rnd(-4,-1),c:'#c8781a',s:1.2,fy:landY(b.cx)});
  sfx.pop(rnd(.5,.9));buzz(8);
}

function blocked(b){const o=boxOf(b);return o&&!o.open}
cv.addEventListener('pointerdown',e=>{
  audioInit();hideHint();
  const[x,y]=local(e);
  if(controls(x,y))return;
  cv.setPointerCapture(e.pointerId);ptr.down=true;ptr.x=ptr.lx=x;ptr.y=ptr.ly=y;ptr.trail=[{x,y,t:performance.now()}];
  for(const b of bodies)b.hits=[];
  if(tool==='hand'){
    let pick=null;
    for(let i=bodies.length-1;i>=0;i--){const b=bodies[i];if(!blocked(b)&&inside(x,y,b.pts)){pick=b;break}}
    if(!pick){let bd=36*36;for(const b of bodies){if(blocked(b))continue;for(const p of b.pts){const d=(p.x-x)**2+(p.y-y)**2;if(d<bd){bd=d;pick=b}}}}
    if(pick){let bi=0,bd=1e18;pick.pts.forEach((p,i)=>{const d=(p.x-x)**2+(p.y-y)**2;if(d<bd){bd=d;bi=i}});
      ptr.grab=pick;ptr.gi=bi;bodies.splice(bodies.indexOf(pick),1);bodies.push(pick);sfx.squish(.12)}
  }else if(tool==='mallet')smash(x,y);
});
cv.addEventListener('pointermove',e=>{
  if(!ptr.down)return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[];
  for(const ev of(evs.length?evs:[e])){const[x,y]=local(ev);ptr.lx=ptr.x;ptr.ly=ptr.y;ptr.x=x;ptr.y=y;
    if(tool==='knife'){ptr.trail.push({x,y,t:performance.now()});knife(ptr.lx,ptr.ly,x,y)}}
});
function up(){ptr.down=false;ptr.grab=null;for(const b of bodies)b.hits=[]}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

function knife(ax,ay,bx,by){
  if(Math.hypot(bx-ax,by-ay)<1)return;
  for(const b of bodies.slice()){
    if(blocked(b))continue;
    if(Math.max(ax,bx)<b.minX||Math.min(ax,bx)>b.maxX||Math.max(ay,by)<b.minY||Math.min(ay,by)>b.maxY)continue;
    const hs=[],p=b.pts,n=p.length;
    for(let i=0;i<n;i++){const q=p[i],r=p[(i+1)%n],h=segInt(ax,ay,bx,by,q.x,q.y,r.x,r.y);if(h)hs.push(h)}
    hs.sort((u,v)=>u.t-v.t);b.hits.push(...hs);
    if(b.hits.length>=2){const A=b.hits[0],B=b.hits[b.hits.length-1];b.hits=[];
      if(Math.hypot(B.x-A.x,B.y-A.y)>b.R*.25)cut(b,A,B)}
  }
}

/* ================= cutting ================= */
function cut(b,A,B,silent){
  if((b.type==='egg'&&b.cook<.5)||b.type==='yolk'){burst(b);return}
  const pts=b.pts,n=pts.length,dx=B.x-A.x,dy=B.y-A.y;
  const side=pts.map(p=>dx*(p.y-A.y)-dy*(p.x-A.x));
  const cr=[];for(let i=0;i<n;i++)if((side[i]>0)!==(side[(i+1)%n]>0))cr.push(i);
  if(cr.length!==2)return;
  const[i1,i2]=cr;
  const ip=i=>{const j=(i+1)%n,t=side[i]/(side[i]-side[j]),p=pts[i],q=pts[j];
    return{x:p.x+(q.x-p.x)*t,y:p.y+(q.y-p.y)*t,px:p.px+(q.px-p.px)*t,py:p.py+(q.py-p.py)*t}};
  const I1=ip(i1),I2=ip(i2);
  const avgL=b.L.reduce((s,v)=>s+v,0)/n;
  const mk=I=>Object.assign(P(I.x,I.y),{px:I.px,py:I.py,cut:true});
  const chord=(F,T)=>{const d=Math.hypot(T.x-F.x,T.y-F.y),k=Math.max(0,Math.round(d/avgL)-1),o=[];
    for(let i=1;i<=k;i++){const t=i/(k+1);o.push(mk({x:F.x+(T.x-F.x)*t,y:F.y+(T.y-F.y)*t,px:F.px+(T.px-F.px)*t,py:F.py+(T.py-F.py)*t}))}return o};
  const ring=(f,t)=>{const o=[];for(let k=f;;k=(k+1)%n){o.push(pts[k]);if(k===t)break}return o};
  const p1=[mk(I1),...ring((i1+1)%n,i2),mk(I2),...chord(I2,I1)];
  const p2=[mk(I2),...ring((i2+1)%n,i1),mk(I1),...chord(I1,I2)];
  const O={x:b.cx+b.texOff.x*Math.cos(b.rot)-b.texOff.y*Math.sin(b.rot),y:b.cy+b.texOff.x*Math.sin(b.rot)+b.texOff.y*Math.cos(b.rot)};
  const TA=b.texRot0+b.rot,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;
  remove(b);if(!silent)sfx.cut();
  for(const[pp,sg]of[[p1,side[(i1+1)%n]>0?1:-1],[p2,side[(i2+1)%n]>0?1:-1]]){
    for(const p of pp){p.x+=nx*sg*1.5;p.y+=ny*sg*1.5;p.px+=nx*sg*.6;p.py+=ny*sg*.6}
    const a=Math.abs(polyArea(pp));
    if(pp.length<6||a<90){spray(pp,b.m,Math.max(3,a/25),b.type);continue}
    let cx=0,cy=0;for(const p of pp){cx+=p.x;cy+=p.y}cx/=pp.length;cy/=pp.length;
    const nb=add(initBody(b.type,pp,{chunk:b.chunk,tex:b.tex,texOff:{x:O.x-cx,y:O.y-cy},texRot0:TA,inv:10,state:stateOf(b)}));nb.split=b.split;nb.shard=b.shard;
  }
  const m=b.m;if(b.type==='jelly'||m.shards||b.type==='kernel')return;
  const cnt=Math.min(24,3+b.R*.3);
  for(let i=0;i<cnt;i++){const t=Math.random(),x=I1.x+(I2.x-I1.x)*t,y=I1.y+(I2.y-I1.y)*t,sg=Math.random()<.5?1:-1;
    drop(x,y,nx*sg*rnd(.5,3),ny*sg*rnd(.5,3)-rnd(0,1.5),m.juice,rnd(1.2,3))}
  buzz(12);
}

/* ================= bursting ================= */
function remove(b){const i=bodies.indexOf(b);if(i>=0)bodies.splice(i,1);if(ptr.grab===b)ptr.grab=null}
function bodyVel(b){let vx=0,vy=0;for(const p of b.pts){vx+=p.x-p.px;vy+=p.y-p.py}return[vx/b.pts.length,vy/b.pts.length]}
function spray(pts,m,count,type,force=1){
  let cx=0,cy=0,vx=0,vy=0;for(const p of pts){cx+=p.x;cy+=p.y;vx+=p.x-p.px;vy+=p.y-p.py}const n=pts.length;cx/=n;cy/=n;vx/=n;vy/=n;
  for(let i=0;i<count;i++){const p=pts[(Math.random()*n)|0],t=Math.random(),x=cx+(p.x-cx)*t,y=cy+(p.y-cy)*t,a=Math.atan2(y-cy,x-cx),s=rnd(1,7)*force;
    drop(x,y,vx*.6+Math.cos(a)*s,vy*.4+Math.sin(a)*s-rnd(1,4),m.juice,rnd(1.2,4.2),type==='jelly'?.55:1)}
}
function burst(b,quiet,boom){
  remove(b);const m=b.m,[vx,vy]=bodyVel(b),st=stateOf(b);
  if(quiet){spray(b.pts,m,5,b.type);return}
  if(b.type==='egg'&&b.cook<.5){
    sfx.crack();const f=boom?2.4:1;if(boom){sfx.splat(.9);shake=10;toast('Peng! Eier explodieren in der Mikrowelle.')}
    const sbx=closedBoxAt(b.cx,b.cy);for(let i=0;i<14;i++)drops.push({box:sbx,k:'shell',x:b.cx+rnd(-12,12),y:b.cy+rnd(-15,15),vx:vx+rnd(-4,4)*f,vy:vy*.3+rnd(-6,-1)*f,r:rnd(0,TAU),vr:rnd(-.3,.3),s:rnd(3,6.5),life:900+rnd(0,300)});
    if(boom){spray(b.pts,M.yolk,40,'egg',2.2);spray(b.pts,m,30,'egg',2.2)}
    else{
      const w=add(makeBody('eggwhite',b.cx,b.maxY-M.eggwhite.r*.25,{vx:vx*.3,vy:0}));w.inv=15;w.T=b.T;aabb(w);
      const y=add(makeBody('yolk',b.cx+rnd(-3,3),w.minY-M.yolk.r-1,{vx:vx*.3,vy:0}));y.inv=20;y.T=b.T;
      for(let i=0;i<10;i++){const a=rnd(0,TAU),s=rnd(.5,3);drop(b.cx,b.cy,vx*.4+Math.cos(a)*s,Math.sin(a)*s-1,'#f4eccf',rnd(1.5,3.5),.45)}
    }
    buzz(25);return;
  }
  const big=b.R/40;
  sfx.splat(clamp(.3+big*.3,.25,1));
  if(m.shards)for(let i=0;i<14;i++)drops.push({k:'crumb',x:b.cx+rnd(-b.R*.5,b.R*.5),y:b.cy+rnd(-6,6),vx:vx+rnd(-4,4),vy:rnd(-5,-1),c:b.melt>.3?m.juice:m.skin[1],s:rnd(1,2.2),fy:landY(b.cx)});
  if(!m.shards||b.melt>.3)spray(b.pts,m,Math.min(90,b.restArea/(m.rise||m.fat||b.type==='popcorn'||b.type==='mallow'?60:22)),b.type);
  if(m.seed!=='#000'&&!b.chunk&&b.type!=='banana')for(let i=0;i<(b.type==='melon'?14:8);i++){const a=rnd(0,TAU),s=rnd(1,6);
    drops.push({k:'seed',x:b.cx+rnd(-b.R*.5,b.R*.5),y:b.cy+rnd(-b.R*.5,b.R*.5),vx:vx+Math.cos(a)*s,vy:vy*.3+Math.sin(a)*s-2,c:m.seed,s:b.type==='melon'?3:2,fy:floorY+rnd(-12,18),r:rnd(0,TAU)})}
  if(!b.chunk&&!b.shard&&m.chunks&&b.R>11){
    const hard=m.shards&&b.melt<.3;
    for(let i=0;i<m.chunks;i++){const a=i/m.chunks*TAU+rnd(0,1),r=b.R*rnd(.28,.44),d=b.R*.35;
      const c=add(makeBody(b.type,b.cx+Math.cos(a)*d,b.cy+Math.sin(a)*d,{r,n:hard?10:12,chunk:!hard,shard:hard,blob:hard?0:rnd(.1,9),state:st,vx:vx*.5+Math.cos(a)*rnd(2,6),vy:vy*.3+Math.sin(a)*rnd(2,5)-3}));
      c.inv=14}
  }
  shake=Math.max(shake,3+big*5);buzz(30);
}
function closedBoxAt(x,y){for(const o of BOXES)if(!o.open&&inBox(o,x,y))return o;return null}
function drop(x,y,vx,vy,c,s,alpha=1){if(drops.length>1600)return;const bx=closedBoxAt(x,y);drops.push({k:'drop',x,y,vx,vy,c,s,a:alpha,fy:bx?bx.iy1-1:landY(x),box:bx})}
function landY(x){
  if(x>pan.x0+6&&x<pan.x1-6)return pan.y-1;
  if(x>pot.x0+3&&x<pot.x1-3)return pot.y-1;
  return floorY+rnd(-14,20);
}
function puff(x,y,kind){if(puffs.length>220)return;puffs.push({x,y,vx:rnd(-.25,.25),vy:rnd(-1.1,-.5),r:rnd(4,8),life:0,max:rnd(50,90),kind})}

/* ================= mallet ================= */
function smash(x,y){
  const R=78;let hit=false;
  for(const b of bodies.slice()){
    if(blocked(b))continue;
    let mx=0;for(const p of b.pts){const dx=p.x-x,dy=p.y-y,d=Math.hypot(dx,dy);
      if(d<R){const f=1-d/R;mx=Math.max(mx,f);const k=f*15/(d||1);p.x+=dx*k*.7;p.y+=dy*k*.5+f*10}}
    if(inside(x,y,b.pts))mx=1;
    if(mx>0){hit=true;b.health-=100*mx*b.m.hammer;if(b.health<=0&&!b.inv)burst(b)}
  }
  fx.push({x,y,t:0});
  shake=Math.max(shake,hit?9:4);sfx.bonk(hit?.9:.5);if(hit)sfx.squish(.6);buzz(hit?35:10);
}

/* ================= step ================= */
function step(){
  frame++;
  for(const o of[pan,pot])o.T+=(LEVELS[o.lvl]-o.T)*.012;
  const ot=[ROOM,180,250][oven.lvl];oven.T+=((oven.open?lerp(ROOM,ot,.45):ot)-oven.T)*.006;
  if(micro.lvl){micro.T=lerp(micro.T,45,.01);if(--micro.timer<=0||micro.open){micro.lvl=0;if(!micro.open){sfx.ding();toast('Pling! Mikrowelle fertig.')}}}else micro.T=lerp(micro.T,ROOM,.01);
  for(const b of bodies.slice())cookStep(b);
  for(const b of bodies)for(const p of b.pts){const vx=(p.x-p.px)*.996,vy=(p.y-p.py)*.996;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+G}
  for(let it=0;it<4;it++){
    const first=it===0;
    for(const b of bodies){shapeMatch(b,b.ke*.5,first);edges(b);pressure(b)}
    if(ptr.grab&&ptr.down){const b=ptr.grab,n=b.pts.length;for(let k=-2;k<=2;k++){const p=b.pts[(ptr.gi+k+n)%n],w=k?.18:.45;p.x+=(ptr.x-p.x)*w;p.y+=(ptr.y-p.y)*w}}
    for(const b of bodies)aabb(b);
    for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){const a=bodies[i],c=bodies[j];
      if(a.maxX<c.minX||c.maxX<a.minX||a.maxY<c.minY||c.maxY<a.minY)continue;pushPoints(a,c,first);pushPoints(c,a,first)}
    for(const b of bodies){aabb(b);segHit(b,first);bounds(b,first)}
  }
  for(const b of bodies.slice()){
    const m=b.m;if(b.sndCd>0)b.sndCd--;
    if(b.inv>0){b.inv--;b.imp=0;continue}
    if(b.imp>3.5&&!b.sndCd){(b.type==='egg'||b.type==='kernel'||b.shard?sfx.bonk:sfx.squish)(clamp(b.imp/25,.05,.6)*(b.type==='kernel'?.3:1));b.sndCd=8}
    let th=b.chunk?m.thresh*.85:m.thresh;if(b.type==='egg'&&b.cook>.5)th*=3;
    if(b.imp>th)b.health-=(b.imp-th)*m.frag*(b.chunk?1.3:1);
    const ratio=Math.abs(polyArea(b.pts))/b.restArea;
    if(ratio<.62&&m.squeeze&&b.melt<.3)b.health-=(.62-ratio)*40*m.squeeze;
    b.imp=0;
    if(b.health<=0)burst(b);
  }
  for(let i=drops.length-1;i>=0;i--){const d=drops[i];
    d.vy+=G*.9;d.vx*=.995;d.x+=d.vx;d.y+=d.vy;
    if(d.x<0){d.x=0;d.vx*=-.3}else if(d.x>W){d.x=W;d.vx*=-.3}
    const bx=d.box;
    if(bx){if(bx.open)d.box=null;else{if(d.x<bx.ix0+2){d.x=bx.ix0+2;d.vx*=-.3}else if(d.x>bx.ix1-2){d.x=bx.ix1-2;d.vx*=-.3}if(d.y<bx.iy0+2){d.y=bx.iy0+2;d.vy*=-.3}
      if(d.k==='drop'&&Math.random()<.04&&Math.hypot(d.vx,d.vy)>4){stampWall(d.x,d.y,d.c,d.s*.8,d.a,true);drops.splice(i,1);continue}}}
    if(d.k==='shell'){d.r+=d.vr;const fy=(d.box?d.box.iy1:landY(d.x))-1;if(d.y>fy){d.y=fy;d.vy*=-.25;d.vx*=.6;d.vr*=.5}if(--d.life<0)drops.splice(i,1);continue}
    if(d.k==='seed'||d.k==='crumb'){d.r=(d.r||0)+.2;if(d.y>=d.fy){stampSeed(d);drops.splice(i,1)}continue}
    const sp=Math.hypot(d.vx,d.vy);
    if(!d.box&&d.y<counterTop-4&&sp>7&&Math.random()<.025&&!hitsAppliance(d.x,d.y)){stampWall(d.x,d.y,d.c,d.s,d.a);drops.splice(i,1);continue}
    if(d.y>=d.fy){if(d.fy>=floorY-16)stampFloor(d.x,d.fy,d.c,d.s,d.a);else stampPan(d.x,d.fy,d.c,d.s,d.a);drops.splice(i,1)}
  }
  for(let i=drips.length-1;i>=0;i--){const d=drips[i];d.y+=d.v;d.x+=rnd(-.15,.15);d.w*=.997;d.len-=d.v;
    stx.globalAlpha=.5*d.a;stx.fillStyle=d.c;stx.beginPath();stx.arc(d.x,d.y,d.w,0,TAU);stx.fill();stx.globalAlpha=1;
    if(d.len<=0||d.y>counterTop-2||d.w<.4||(d.inner?d.y>d.inner.iy1-2:hitsAppliance(d.x,d.y)))drips.splice(i,1)}
  for(let i=puffs.length-1;i>=0;i--){const p=puffs[i];p.x+=p.vx+Math.sin((frame+i)*.05)*.2;p.y+=p.vy;p.vy*=.995;p.r+=.18;if(++p.life>p.max)puffs.splice(i,1)}
  for(let i=fx.length-1;i>=0;i--){if(++fx[i].t>18)fx.splice(i,1)}
  shake*=.85;
  let siz=0;for(const b of bodies){const w=where(b);if((w==='pan'||w==='pot')&&b.T>105&&b.m.heat)siz+=b.type==='kernel'?.25:1}
  loops.set('sizzle',Math.min(.2,siz*.045));
  loops.set('gas',(pan.lvl?.03:0)+(pot.lvl?.03:0));
  loops.set('hum',micro.lvl?.05:0);loops.set('oven',oven.lvl?.025:0);
}
function hitsAppliance(x,y){for(const o of BOXES)if(x>o.x&&x<o.x+o.w&&y>o.y&&y<o.y+o.h)return true;return false}

/* ================= stains ================= */
function stampFloor(x,y,c,s,a=1){
  stx.save();stx.fillStyle=c;stx.globalAlpha=.55*a;
  stx.beginPath();stx.ellipse(x,y,s*rnd(1.3,2.2),s*rnd(.45,.6),0,0,TAU);stx.fill();
  if(s>2.5){for(let k=0;k<2;k++){stx.beginPath();stx.ellipse(x+rnd(-s*3,s*3),y+rnd(-s*.6,s*.6),s*.45,s*.18,0,0,TAU);stx.fill()}}
  stx.globalAlpha=.22*a;stx.fillStyle='#fff';stx.beginPath();stx.ellipse(x-s*.5,y-s*.18,s*.5,s*.1,0,0,TAU);stx.fill();
  stx.restore();mess+=s*s;
}
function stampPan(x,y,c,s,a){stx.save();stx.fillStyle=c;stx.globalAlpha=.3*a;stx.beginPath();stx.ellipse(x,y,s*1.2,s*.35,0,0,TAU);stx.fill();stx.restore();mess+=s*s*.3}
function stampWall(x,y,c,s,a=1,inner=false){
  stx.save();stx.fillStyle=c;stx.globalAlpha=.6*a;
  stx.beginPath();stx.arc(x,y,s*1.2,0,TAU);stx.fill();
  for(let k=0;k<5;k++){const ang=rnd(0,TAU),d=s*rnd(1.5,4);stx.beginPath();stx.arc(x+Math.cos(ang)*d,y+Math.sin(ang)*d,s*rnd(.15,.45),0,TAU);stx.fill()}
  stx.globalAlpha=.25*a;stx.fillStyle='#fff';stx.beginPath();stx.arc(x-s*.4,y-s*.4,s*.35,0,TAU);stx.fill();
  stx.restore();mess+=s*s*1.5;
  if(s>2.4&&Math.random()<.6)drips.push({x,y:y+s*.6,v:rnd(.25,.7),w:s*.55,len:rnd(30,160),c,a,inner:inner?closedBoxAt(x,y)||BOXES.find(o=>inBox(o,x,y)):null});
}
function stampSeed(d){stx.save();stx.translate(d.x,d.fy);stx.rotate(d.r);stx.fillStyle=d.c;stx.beginPath();stx.ellipse(0,0,d.s*1.4,d.s*.8,0,0,TAU);stx.fill();
  if(d.k==='seed'){stx.fillStyle='rgba(255,255,255,.35)';stx.beginPath();stx.ellipse(-d.s*.4,-d.s*.3,d.s*.4,d.s*.2,0,0,TAU);stx.fill()}stx.restore();mess+=d.s}

/* ================= static background ================= */
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function drawBg(){
  const g=bgx;g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle='#151b19';g.fillRect(0,0,W,H);
  const tw=clamp(W/5.5,58,110),th=tw/2,gr=2.5;
  for(let r=0,y=-th*.3;y<counterTop;r++,y+=th){const off=(r%2)*tw/2;
    for(let x=-off;x<W;x+=tw){const v=rnd(-6,6),lg=g.createLinearGradient(0,y,0,y+th);
      lg.addColorStop(0,`rgb(${52+v},${66+v},${62+v})`);lg.addColorStop(.5,`rgb(${40+v},${52+v},${49+v})`);lg.addColorStop(1,`rgb(${33+v},${43+v},${40+v})`);
      g.fillStyle=lg;rr(g,x+gr/2,y+gr/2,tw-gr,th-gr,4);g.fill();
      g.fillStyle='rgba(255,255,255,.07)';rr(g,x+4,y+3,tw-10,3,2);g.fill();
      g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=1;rr(g,x+gr/2,y+gr/2,tw-gr,th-gr,4);g.stroke()}}

    X.fillStyle=steel(X,x-r,y-r,x+r,y+r);X.beginPath();X.arc(x,y,r,0,TAU);X.fill();
    X.fillStyle='#1a1b1e';X.beginPath();X.arc(x,y,r-4,0,TAU);X.fill();
    const a=-Math.PI/2+o.lvl*1.2;X.strokeStyle='#e8e2d8';X.lineWidth=2.5;X.lineCap='round';X.beginPath();X.moveTo(x+Math.cos(a)*2,y+Math.sin(a)*2);X.lineTo(x+Math.cos(a)*(r-5),y+Math.sin(a)*(r-5));X.stroke();
    X.fillStyle=o.lvl?(o.lvl===2?'#ff5a2a':'#ffa040'):'#3a2a24';X.beginPath();X.arc(x+r+7,y-6,2.5,0,TAU);X.fill();
    X.font=`700 8px ${UIFONT}`;X.fillStyle='rgba(246,234,216,.6)';X.fillText(name.toUpperCase(),x,y+r+8);
  }
}

/* ================= frame render ================= */
function render(){
  const s=reduce?0:shake;shakeX=rnd(-s,s)*.5*DPR;shakeY=rnd(-s,s)*.5*DPR;
  ctx.setTransform(DPR,0,0,DPR,shakeX,shakeY);X=ctx;
  ctx.drawImage(bg,0,0,W,H);
  drawMicroBack();drawOvenBack();
  ctx.drawImage(st,0,0,W,H);
  const groups={oven:[],micro:[],pot:[],pan:[],out:[]};
  for(const b of bodies){aabb(b);groups[where(b)||'out'].push(b)}
  for(const b of groups.oven)drawBody(b);drawOvenFront();
  for(const b of groups.micro)drawBody(b);drawMicroFront();
  for(const b of groups.out)drawShadow(b);
  drawPanBack();for(const b of groups.pan)drawBody(b);drawPanFront();
  drawPotBack();for(const b of groups.pot)drawBody(b);drawPotFront();
  for(const b of groups.out)drawBody(b);
  drawDrops();drawPuffs();drawKnobs();drawFx();if(tool==='knife')drawTrail();
}

/* ================= audio ================= */
let AC=null,NB=null,muted=false,sndBudget=0;
const loops={nodes:{},set(k,v){const n=this.nodes[k];if(n&&AC)n.gain.setTargetAtTime(muted?0:v,AC.currentTime,.1)}};
function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*2;NB=AC.createBuffer(1,n,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const mk=(type,f,q,osc)=>{const g=AC.createGain();g.gain.value=0;let src;if(osc){src=AC.createOscillator();src.frequency.value=osc}else{src=AC.createBufferSource();src.buffer=NB;src.loop=true}
    const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;src.connect(fl).connect(g).connect(AC.destination);src.start();return g};
  loops.nodes.sizzle=mk('bandpass',4200,.6);loops.nodes.gas=mk('lowpass',380,.7);loops.nodes.hum=mk('lowpass',200,1,120);loops.nodes.oven=mk('lowpass',260,.8);
}catch(e){AC=null}}
function ok(){if(!AC||muted||sndBudget>5)return false;sndBudget++;if(AC.state==='suspended')AC.resume();return true}
function noise(dur,type,f0,f1,vol,q=1){if(!ok())return;const t=AC.currentTime,s=AC.createBufferSource();s.buffer=NB;s.playbackRate.value=rnd(.7,1.3);
  const f=AC.createBiquadFilter();f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.001,vol),t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(AC.destination);s.start(t,rnd(0,1));s.stop(t+dur+.05)}
function tone(f0,f1,dur,vol,type='sine'){if(!ok())return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02)}
const sfx={
  squish:v=>noise(.16,'lowpass',rnd(900,1500),160,v*.55,3),
  splat:v=>{noise(.4,'lowpass',2800,140,v*.9,1);tone(130,38,.22,v*.8);noise(.3,'bandpass',1200,250,v*.5,4)},
  cut:()=>noise(.09,'highpass',2400,7000,.22,.7),
  crack:()=>{for(let k=0;k<4;k++)setTimeout(()=>noise(.035,'highpass',2600,5200,.35,1),k*22)},
  bonk:v=>{tone(95,42,.16,v*.9);noise(.06,'lowpass',800,200,v*.3)},
  pop:v=>{noise(.05,'bandpass',rnd(1400,2200),900,v*.7,2);tone(320,120,.05,v*.25)},
  click:()=>{noise(.025,'highpass',3000,5000,.25,1);tone(1200,900,.02,.05)},
  door:()=>{tone(140,70,.12,.4);noise(.08,'lowpass',900,200,.2)},
  ding:()=>{tone(1760,1750,1.2,.18);tone(2637,2630,.9,.06)},
};
function buzz(ms){try{if(navigator.userActivation&&!navigator.userActivation.hasBeenActive)return;navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

/* ================= UI ================= */
document.querySelectorAll('.tool').forEach(btn=>btn.addEventListener('click',()=>{tool=btn.dataset.tool;
  document.querySelectorAll('.tool').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)))}));
const sndBtn=document.getElementById('snd');
sndBtn.addEventListener('click',()=>{audioInit();muted=!muted;document.getElementById('wave').hidden=muted;document.getElementById('xmark').hidden=!muted;
  sndBtn.setAttribute('aria-label',muted?'Ton einschalten':'Ton ausschalten');for(const k in loops.nodes)loops.set(k,0)});
document.getElementById('clean').addEventListener('click',()=>{stx.clearRect(0,0,W,H);drops=[];drips=[];puffs=[];mess=0;bodies=[];ptr.grab=null;toast('Alles sauber.')});
const tray=document.getElementById('tray');
function iconFor(type){
  const c=document.createElement('canvas');c.width=c.height=96;const g=c.getContext('2d');
  const b=type==='kernel'?makeBody('popcorn',0,0,{r:20,seed:2}):makeBody(type,0,0);
  aabb(b);const s=36/Math.max(b.maxX-b.minX,b.maxY-b.minY);
  for(const p of b.pts){p.x*=s;p.y*=s}b.R*=s;b.tex=makeTex(b.tex.R*s);b.cx=0;b.cy=0;aabb(b);
  g.scale(2,2);g.translate(24,24+(b.m.stem==='top'||b.m.stem==='navel'?3:0));X=g;drawBody(b);X=ctx;return c;
}
let lastCat=null;
for(const type of FOODS){
  const cat=M[type].cat;if(cat!==lastCat){const l=document.createElement('div');l.className='cat';l.textContent=cat==='sweet'?'Süß':'Herzhaft';tray.append(l);lastCat=cat}
  const btn=document.createElement('button');btn.className='food';btn.setAttribute('aria-label',M[type].label+' holen');
  const l=document.createElement('span');l.textContent=M[type].label;
  btn.append(iconFor(type),l);tray.append(btn);
  btn.addEventListener('click',()=>{audioInit();hideHint();spawn(type)});
}
function spawn(type){
  const m=M[type];
  if(type==='kernel'){for(let i=0;i<12;i++)add(makeBody('kernel',pot.cx+rnd(-pot.w*.3,pot.w*.3),pot.y-pot.h-10-i*7,{vx:rnd(-.5,.5)}));sfx.squish(.1);
    if(!pot.lvl)toast('Maiskörner im Topf. Dreh den Topf-Knopf auf volle Hitze.');return}
  const r=m.r*1.3;let x,y;
  if(type==='egg'){const B=LY.board;x=rnd(B.x0+r,Math.max(B.x0+r+1,B.x1-r));y=B.y-m.r*1.05-14}
  else{x=clamp(rnd(W*.08,W*.92),r,W-r);y=Math.min(counterTop-m.r-20,floorY-m.r-100)}
  add(makeBody(type,x,y,{vx:rnd(-.6,.6),vr:rnd(-.008,.008)}));sfx.squish(.1);
}
const toastEl=document.getElementById('toast');let toastT=null,hintOn=true;
function toast(t){toastEl.textContent=t;toastEl.style.opacity='1';clearTimeout(toastT);toastT=setTimeout(()=>toastEl.style.opacity='0',2600);hintOn=false}
function hideHint(){if(hintOn){hintOn=false;clearTimeout(toastT);toastT=setTimeout(()=>toastEl.style.opacity='0',2500)}}
setTimeout(()=>{if(hintOn)hideHint()},6000);
const messEl=document.getElementById('mess'),barEl=document.getElementById('mbar');
function updMess(){const v=Math.min(100,Math.round(mess/(W*H*.012)*100));messEl.textContent=v+'%';barEl.style.width=v+'%'}

/* ================= sizing & loop ================= */
function resize(){
  const r=cv.getBoundingClientRect(),oW=W,oH=H;
  let old=null;if(oW){old=document.createElement('canvas');old.width=st.width;old.height=st.height;old.getContext('2d').drawImage(st,0,0)}
  W=r.width;H=r.height;DPR=Math.min(2,window.devicePixelRatio||1);
  for(const c of[cv,bg,st]){c.width=Math.round(W*DPR);c.height=Math.round(H*DPR)}
  layout();
  stx.setTransform(DPR,0,0,DPR,0,0);if(old)stx.drawImage(old,0,0,oW,oH);
  drawBg();
}
addEventListener('resize',resize);resize();

(function scene(){
  const B=LY.board,bw=B.x1-B.x0;
  const place=(t,x,y)=>{const b=add(makeBody(t,x,y));b.inv=120;return b};
  place('tomato',B.x0+M.tomato.r*1.1,B.y-M.tomato.r*.9-2);
  place('egg',Math.min(B.x1-M.egg.r*.7,B.x0+M.tomato.r*2.3+M.egg.r),B.y-M.egg.r*1.03-2);
  place('steak',pan.cx,pan.y-M.steak.r*.6-3);
  for(let i=0;i<10;i++)place('kernel',pot.cx+(i%5-2)*pot.w*.15,pot.y-8-Math.floor(i/5)*12);
  place('dough',(oven.ix0+oven.ix1)/2,oven.iy1-M.dough.r*.8-3);
  place('chocolate',(micro.ix0+micro.ix1)/2,micro.iy1-M.chocolate.r*.5-3);
})();
for(let i=0;i<90;i++)step();

let last=performance.now(),acc=0,tick=0;
function loop(t){
  acc+=Math.min(60,t-last);last=t;let n=0;
  while(acc>=1000/60&&n<3){sndBudget=0;step();acc-=1000/60;n++}
  render();if(++tick%10===0)updMess();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.addEventListener('visibilitychange',()=>{if(AC){document.hidden?AC.suspend():AC.resume()}last=performance.now()});
window.__kitchen={bodies:()=>bodies,pan,pot,oven,micro,spawn,step,controls,where,LY};
})();
</script>
