<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Squish Kitchen</title>
<meta name="theme-color" content="#141917">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Squish Kitchen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Courier+Prime:wght@400;700&family=Familjen+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: landscape kitchen of 5 stations (canvas, swipe between them); left pantry rail; top bar with station tabs; order ticket for the guest. Diner signage look: Bungee + Courier Prime, flat ink colors. */
:root{
  --bg:#1c1712;
  --rail:#221b15;
  --line:rgba(255,236,210,.13);
  --fg:#f6ead8;
  --muted:#b6a48c;
  --tomato:#d8341f;
  --tomato-dk:#8a1e0e;
  --mustard:#ffcf3a;
  --leaf:#3f8f3a;
  --paper:#fbf3e4;
  --ink:#2a1208;
  --side:84px;
  --sign:"Bungee",Impact,"Arial Black",sans-serif;
  --mono:"Courier Prime","Courier New",monospace;
  --ui:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
canvas#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#sa{position:fixed;left:0;top:0;width:0;height:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);visibility:hidden;pointer-events:none}
button,select{font-family:var(--ui)}
.side{position:absolute;left:0;top:0;bottom:0;width:calc(var(--side) + env(safe-area-inset-left,0px));z-index:2;display:flex;flex-direction:column;gap:6px;
  padding:calc(8px + env(safe-area-inset-top,0px)) 6px calc(6px + env(safe-area-inset-bottom,0px)) calc(6px + env(safe-area-inset-left,0px));
  background:var(--rail);border-right:2px solid #120d09}
.tools{display:flex;gap:2px;background:#16110d;border-radius:10px;padding:2px;flex:none}
.tool{appearance:none;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;flex:1;height:30px;border-radius:8px;cursor:pointer;padding:0}
.tool svg{width:18px;height:18px}
.tool[aria-pressed="true"]{background:var(--mustard);color:var(--ink)}
.catsel{appearance:none;-webkit-appearance:none;width:100%;border:1px solid var(--line);border-radius:8px;background:#16110d;color:var(--fg);font:700 10px var(--ui);padding:6px 4px;text-align:center;text-align-last:center;flex:none}
.tray{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:1px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tray::-webkit-scrollbar{display:none}
.food{position:relative;appearance:none;border:0;background:transparent;color:var(--muted);font:500 10px/1.15 var(--ui);display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px;border-radius:10px;cursor:pointer;flex:none;text-align:center}
.food:active{background:rgba(255,255,255,.08)}
.food canvas{width:38px;height:38px}
.food .n{position:absolute;top:2px;right:6px;min-width:18px;background:var(--tomato);color:#fff;font:700 10px var(--ui);border-radius:9px;padding:1px 5px;font-variant-numeric:tabular-nums}
.food[disabled]{opacity:.28;cursor:default}
.food.pulse,.tab.pulse,.cta.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--mustard)}}
.top{position:absolute;right:0;top:0;left:calc(var(--side) + env(safe-area-inset-left,0px));display:flex;align-items:center;gap:6px;z-index:2;
  padding:calc(6px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 0 8px;pointer-events:none}
.top>*{pointer-events:auto}
.tabs{display:flex;gap:2px;background:rgba(28,23,18,.92);border:1px solid var(--line);border-radius:10px;padding:2px;margin-right:auto}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font:700 11px var(--ui);padding:6px 9px;border-radius:8px;cursor:pointer;letter-spacing:.02em}
.tab[aria-current="true"]{background:var(--fg);color:var(--ink)}
.meter{background:rgba(28,23,18,.92);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center}
.meter b{color:var(--fg);font-variant-numeric:tabular-nums;font-size:12px;letter-spacing:0;min-width:3.2ch;text-align:right}
.bar{width:26px;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--tomato)}
.btn{appearance:none;border:1px solid var(--line);background:rgba(28,23,18,.92);color:var(--fg);font:700 12px var(--ui);border-radius:10px;padding:6px 10px;cursor:pointer}
.btn.icon{padding:5px 7px;display:grid;place-items:center}
.btn svg{width:17px;height:17px;display:block}
.btn:focus-visible,.tool:focus-visible,.food:focus-visible,.cta:focus-visible,.lv:focus-visible,.tab:focus-visible,.chap:focus-visible{outline:2px solid var(--mustard);outline-offset:2px}
.hud{position:absolute;z-index:2;top:calc(44px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));width:206px;
  background:var(--paper);color:var(--ink);border-radius:4px;padding:8px 9px 9px;display:grid;grid-template-columns:38px 1fr auto;gap:6px 8px;align-items:center;font-family:var(--mono);
  box-shadow:0 6px 16px rgba(0,0,0,.35)}
.hud:before{content:"";position:absolute;left:0;right:0;top:-5px;height:6px;background:radial-gradient(circle at 4px 0,transparent 4px,var(--paper) 4.5px) -4px 0/8px 6px repeat-x}
.hud canvas{width:38px;height:38px;border-radius:4px;background:#f0e2c8;cursor:pointer}
.hud b{font:700 12px var(--mono);display:block;line-height:1.1}
.hud small{font-size:10px;color:#7a5a3a}
.timer{font:15px var(--sign);color:var(--ink);font-variant-numeric:tabular-nums}
.timer.low{color:var(--tomato)}
.wl{grid-column:1/-1;margin:0;padding:6px 0 0;border-top:1px dashed #b8a080;list-style:none;font-size:11px;line-height:1.35;display:grid;gap:1px}
.wl li:before{content:"– "}
.wl li.no{color:var(--tomato)}
.cta{appearance:none;border:2px solid var(--ink);border-radius:8px;background:var(--tomato);color:#fff;font:15px var(--sign);padding:8px 14px;cursor:pointer;letter-spacing:.02em}
.cta:active{transform:translateY(1px)}
.cta.ghost{background:var(--paper);color:var(--ink)}
.cta.green{background:var(--leaf)}
.cta.yellow{background:var(--mustard);color:var(--ink)}
.hud .cta{grid-column:1/-1;padding:7px 8px;font-size:13px}
.toast{position:absolute;z-index:3;left:calc(var(--side) + env(safe-area-inset-left,0px) + (100% - var(--side) - env(safe-area-inset-left,0px) - 226px)/2);top:calc(48px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#16110d;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;line-height:1.35;color:var(--fg);pointer-events:none;transition:opacity .4s;text-align:center;max-width:min(420px,calc(100% - var(--side) - 260px));width:max-content}
.coach{position:absolute;z-index:4;top:calc(44px + env(safe-area-inset-top,0px));right:calc(max(10px,env(safe-area-inset-right,0px)) + 216px);width:min(250px,calc(100% - var(--side) - 250px));background:var(--mustard);color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:9px 11px;font-size:13px;line-height:1.35;display:grid;gap:7px}
.coach b{font:12px var(--sign)}
.coach .row{justify-content:space-between}
.coach button{appearance:none;border:0;background:none;color:var(--ink);font:700 11px var(--ui);text-decoration:underline;cursor:pointer;padding:0}
.screen{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;overflow:auto;background:rgba(18,12,8,.72);
  padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--paper);color:var(--ink);border-radius:6px;border:2px solid var(--ink);width:min(780px,100%);max-height:100%;overflow:auto;padding:14px 16px}
.card h2{font:22px var(--sign);margin:0;line-height:1.05;color:var(--tomato-dk)}
.card h3{font:11px var(--sign);letter-spacing:.06em;color:#7a5a3a;margin:0 0 6px}
.card p{margin:0;line-height:1.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.menu{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;align-items:center;width:min(760px,100%)}
.menu .logo-big svg{width:100%;max-width:380px;height:auto;display:block}
.menu .btns{display:grid;gap:10px}
.menu .cta{font-size:20px;padding:12px 16px;text-align:left;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.menu .cta small{font:700 12px var(--ui);opacity:.9}
.menu .note{color:var(--muted);font-size:12px}
.chaps{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.chap{appearance:none;flex:none;border:2px solid var(--ink);background:#fff8ec;color:var(--ink);border-radius:6px;padding:6px 10px;font:700 12px var(--ui);cursor:pointer;text-align:left;display:grid;gap:1px}
.chap small{font:400 10px var(--mono);color:#7a5a3a}
.chap[aria-current="true"]{background:var(--ink);color:var(--paper)}
.chap[aria-current="true"] small{color:#d8c4a4}
.chap[disabled]{opacity:.4;cursor:default}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.lv{appearance:none;border:2px solid var(--ink);background:#fff8ec;border-radius:6px;padding:6px 4px;color:var(--ink);cursor:pointer;position:relative;display:grid;justify-items:center;gap:2px;min-width:0}
.lv canvas{width:52px;height:52px;border-radius:4px;background:#f0e2c8}
.lv b{font:13px var(--sign)}
.lv small{font:400 10px var(--mono);color:#6a4a2a;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv .st{font-size:12px;letter-spacing:1px;color:#c88a00;line-height:1}
.lv.boss{background:var(--mustard)}
.lv[disabled]{opacity:.35;cursor:default}
.off{color:#d8c8ac}
.two{display:grid;grid-template-columns:minmax(140px,.75fr) 1.3fr;gap:16px;align-items:start}
.who{display:grid;justify-items:center;text-align:center;gap:5px}
.who canvas{width:116px;height:116px;border-radius:4px;background:#f0e2c8}
.who small{color:#7a5a3a;font-family:var(--mono)}
.quote{font-family:var(--mono);font-size:13px;line-height:1.35;border-left:3px solid var(--tomato);padding:2px 0 2px 8px;text-align:left}
.ticket{font-family:var(--mono);background:#fffdf6;border:1px solid #e0cfae;padding:10px 12px;position:relative}
.ticket ul{margin:0;padding:0;list-style:none;display:grid;gap:2px;font-size:13px}
.ticket li:before{content:"[ ] "}
.ticket .meta{display:flex;justify-content:space-between;font-size:11px;color:#7a5a3a;border-bottom:1px dashed #c8b08a;padding-bottom:5px;margin-bottom:6px}
.pantry{display:flex;flex-wrap:wrap;gap:4px}
.pantry span{background:#f0e2c8;border-radius:4px;padding:3px 7px;font:12px var(--mono)}
.score{font:46px var(--sign);line-height:1;color:var(--tomato-dk)}
.score small{font:14px var(--ui);color:#7a5a3a}
.bigstars{font-size:28px;letter-spacing:3px;color:#c88a00;line-height:1}
.crit{display:grid;gap:4px;margin:8px 0;font-family:var(--mono)}
.crit div{display:grid;grid-template-columns:92px 1fr 64px;gap:8px;align-items:center;font-size:12px}
.crit i{display:block;height:8px;background:#ead9bd;overflow:hidden;border-radius:2px}
.crit i u{display:block;height:100%;text-decoration:none}
.crit em{font-style:normal;color:#7a5a3a;font-size:11px;text-align:right}
.dish{font:12px var(--mono);color:#5a3a20}
.rotate{position:absolute;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;padding:24px}
.rotate svg{width:72px;height:72px;animation:rot 2.4s ease-in-out infinite}
.rotate h2{font:26px var(--sign);color:var(--mustard);margin:0}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){.rotate svg,.pulse{animation:none!important}}
@media (max-height:420px){.card{padding:10px 12px}.card h2{font-size:18px}.who canvas{width:86px;height:86px}.score{font-size:36px}.grid{gap:6px}.lv canvas{width:40px;height:40px}}
@media (max-width:760px){.tab{padding:6px 6px;font-size:10px}.hud{width:190px}.meter .bar{display:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c" aria-label="Küche zum Spielen und Kochen"></canvas>
  <div id="sa"></div>
  <aside class="side">
    <div class="tools" role="group" aria-label="Werkzeug">
      <button class="tool" data-tool="hand" aria-pressed="true" aria-label="Greifen und werfen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5V4a1.5 1.5 0 0 1 3 0v7m0-5.5a1.5 1.5 0 0 1 3 0V12m0-3.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-4.6-2.2L4.4 15.6a1.6 1.6 0 0 1 2.4-2.1L8 14.8"/></svg></button>
      <button class="tool" data-tool="knife" aria-pressed="false" aria-label="Messer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l7.5-7.5"/><path d="M10.5 13.5L20 4c1 3-1 9-7 11.5z"/></svg></button>
      <button class="tool" data-tool="mallet" aria-pressed="false" aria-label="Fleischklopfer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="12" height="7" rx="1.5" transform="rotate(45 15 6)"/><path d="M11.5 12.5L3.5 20.5"/></svg></button>
    </div>
    <select class="catsel" id="catSel" aria-label="Kategorie"></select>
    <div class="tray" id="tray" aria-label="Zutaten holen"></div>
  </aside>
  <div class="top">
    <button class="btn icon" id="menuBtn" aria-label="Menü"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <nav class="tabs" id="tabs" aria-label="Stationen"></nav>
    <div class="meter" title="Wie dreckig die Küche ist">Sauerei <span class="bar"><i id="mbar"></i></span><b id="mess">0%</b></div>
    <button class="btn icon" id="snd" aria-label="Ton ausschalten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z"/><path id="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path id="xmark" d="M16 10l5 5M21 10l-5 5" hidden/></svg></button>
    <button class="btn" id="clean">Putzen</button>
  </div>
  <div class="hud" id="hud" hidden>
    <canvas id="hudFace" width="76" height="76" aria-label="Bestellung ansehen"></canvas>
    <div style="min-width:0"><b id="hudName"></b><small id="hudTitle"></small></div>
    <div class="timer" id="hudTimer"></div>
    <ul class="wl" id="hudWish"></ul>
    <button class="cta" id="serve">Servieren</button>
  </div>
  <div class="coach" id="coach" hidden><b id="coachStep"></b><span id="coachText"></span><div class="row"><span></span><button id="coachSkip">Tutorial beenden</button></div></div>
  <div class="toast" id="toast" style="opacity:0"></div>

  <div class="screen" id="scrMenu">
    <div class="menu">
      <div class="logo-big" id="logoBig"></div>
      <div class="btns">
        <button class="cta" id="goStory">Story <small id="storyProg"></small></button>
        <button class="cta green" id="goSandbox">Sandkasten <small id="sandCount"></small></button>
        <button class="cta yellow" id="goTut">Tutorial <small>3 Minuten</small></button>
        <p class="note" id="menuNote"></p>
      </div>
    </div>
  </div>

  <div class="screen" id="scrLevels" hidden>
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 id="chapTitle">Gästeliste</h2><button class="cta ghost" data-back="menu">Zurück</button></div>
      <div class="chaps" id="chapList"></div>
      <div class="grid" id="levelGrid"></div>
    </div>
  </div>

  <div class="screen" id="scrIntro" hidden>
    <div class="card two">
      <div class="who"><canvas id="introFace" width="232" height="232"></canvas><h2 id="introName"></h2><small id="introTitle"></small><p class="quote" id="introQuote"></p></div>
      <div style="display:grid;gap:10px">
        <div class="ticket"><div class="meta"><span id="introNo"></span><span id="introTime"></span></div><ul id="introWish"></ul></div>
        <div><h3>Deine Zutaten</h3><div class="pantry" id="introPantry"></div></div>
        <p id="introHint" style="font-size:12px;color:#6a4a2a"></p>
        <div class="row"><button class="cta" id="introGo">Kochen</button><button class="cta ghost" id="introBack">Zurück</button></div>
      </div>
    </div>
  </div>

  <div class="screen" id="scrResult" hidden>
    <div class="card two">
      <div class="who"><canvas id="resFace" width="232" height="232"></canvas><h2 id="resName"></h2><p class="quote" id="resQuote"></p></div>
      <div>
        <div class="row" style="justify-content:space-between"><div class="score" id="resScore">0<small> / 100</small></div><div class="bigstars" id="resStars"></div></div>
        <p class="dish" id="resDish"></p>
        <div class="crit" id="resCrit"></div>
        <div class="row" id="resBtns"></div>
      </div>
    </div>
  </div>

  <div class="rotate" id="rotate" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="#ffcf3a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M11 18.5h2"/></svg>
    <h2>Dreh dein Handy</h2>
    <p style="color:var(--muted);max-width:30ch;line-height:1.4">Squish Kitchen wird im Querformat gespielt.</p>
  </div>
</div>

<script>
(()=>{
'use strict';
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const bg=document.createElement('canvas'), bgx=bg.getContext('2d');
const st=document.createElement('canvas'), stx=st.getContext('2d');
let W=0,H=0,DPR=1,floorY=0,counterTop=0,counterFront=0,WW=0,BD=1,camX=0,camT=0;
const STN=['Brett','Herd','Ofen','Fritte','Teller'];
let X=ctx;
const G=0.42, TAU=Math.PI*2, ROOM=20;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;

/* ================= colours ================= */
const hcache={};
function rgb(c){if(hcache[c])return hcache[c];const h=c.replace('#','');return hcache[c]=[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function mix(a,b,t){const A=rgb(a),B=rgb(b);t=clamp(t,0,1);return'#'+[0,1,2].map(i=>Math.round(A[i]+(B[i]-A[i])*t).toString(16).padStart(2,'0')).join('')}
const BURNT=['#4a3020','#24160c','#0c0604'];

/* ================= shapes ================= */
function param(fn,m=96){const o=[];for(let i=0;i<m;i++)o.push(fn(i/m*TAU));return o}
function rrect(w,h,r){const o=[],hw=w/2,hh=h/2;r=Math.min(r,hw,hh);
  for(const[cx,cy,a0]of[[hw-r,hh-r,0],[-hw+r,hh-r,Math.PI/2],[-hw+r,-hh+r,Math.PI],[hw-r,-hh+r,Math.PI*1.5]])
    for(let i=0;i<=8;i++){const a=a0+i/8*Math.PI/2;o.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}return o}
function resample(poly,n){
  const m=poly.length,L=[];let tot=0;
  for(let i=0;i<m;i++){const a=poly[i],b=poly[(i+1)%m],d=Math.hypot(b[0]-a[0],b[1]-a[1]);L.push(d);tot+=d}
  const out=[];let seg=0,acc=0;
  for(let k=0;k<n;k++){const target=k/n*tot;while(seg<m-1&&acc+L[seg]<target){acc+=L[seg];seg++}
    const t=L[seg]?(target-acc)/L[seg]:0,a=poly[seg],b=poly[(seg+1)%m];out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}
  return out}

/* ================= heat & cooking ================= */
const LEVELS=[ROOM,185,265];
function heatSource(b){
  const w=where(b);
  if(w==='pan')return[pan.T,1];
  if(w==='pot')return[pot.T,.9];
  if(w==='grill')return[grill.T,1.1];
  if(w==='fryer')return b.cy>fryer.oil-b.R*.4?[fryer.T,1.7]:[lerp(ROOM,fryer.T,.3),.4];
  if(w==='oven')return oven.open?[lerp(ROOM,oven.T,.4),.3]:[oven.T,.65];
  if(w==='micro')return(!micro.open&&micro.lvl)?[b.m.pop?215:130,1.8]:[micro.T,.3];
  if(w==='freezer')return freezer.open?[lerp(ROOM,-20,.4),.3]:[-20,1.4];

function cookStep(b){
  const m=b.m;if(!m.heat)return false;
  const[tt,rate]=heatSource(b);
  b.T+=(tt-b.T)*m.heat*rate;
  if(m.cookSec){const over=b.T-m.cookT;if(over>0)b.cook=Math.min(2.4,b.cook+clamp(over/100,0,1.6)/(m.cookSec*60))}
  if(m.melt){if(b.T>m.melt.T)b.melt=Math.min(1,b.melt+(b.T-m.melt.T)*.00035);else if(b.T<m.melt.T-6)b.melt=Math.max(0,b.melt-.0015)}

  if(b.T<-3){k=Math.max(k,.85);e=Math.max(e,.9);pl=0}

  if(b.type==='eggwhite'){k=lerp(.06,.35,clamp(b.cook,0,1));pl=b.cook>.6?0:m.plastic}
  b.ke=k;b.ee=e;b.pl=pl;
  if(b.T>92&&Math.random()<.05+(b.T-92)*.001)puff(b.cx+rnd(-b.R*.5,b.R*.5),b.minY,'steam');
  if(b.cook>1.45&&Math.random()<(b.cook-1.45)*.25)puff(b.cx+rnd(-b.R*.4,b.R*.4),b.minY,'smoke');
  if(b.melt>.55&&Math.random()<.01*b.melt){let lo=b.pts[0];for(const p of b.pts)if(p.y>lo.y)lo=p;drop(lo.x,lo.y+1,rnd(-.3,.3),.5,m.juice,rnd(1.5,3),.9)}

  return false;
}
function popKernel(b){
  remove(b);const[vx]=bodyVel(b);

function knife(ax,ay,bx,by){
  if(Math.hypot(bx-ax,by-ay)<1)return;
  for(const b of bodies.slice()){
    if(blocked(b))continue;
    if(Math.max(ax,bx)<b.minX||Math.min(ax,bx)>b.maxX||Math.max(ay,by)<b.minY||Math.min(ay,by)>b.maxY)continue;
    const hs=[],p=b.pts,n=p.length;
    for(let i=0;i<n;i++){const q=p[i],r=p[(i+1)%n],h=segInt(ax,ay,bx,by,q.x,q.y,r.x,r.y);if(h)hs.push(h)}

/* ================= cutting ================= */
function cut(b,A,B,silent){
  if((b.type==='egg'&&b.cook<.5)||b.type==='yolk'){burst(b);return}
  const pts=b.pts,n=pts.length,dx=B.x-A.x,dy=B.y-A.y;
  const side=pts.map(p=>dx*(p.y-A.y)-dy*(p.x-A.x));
  const cr=[];for(let i=0;i<n;i++)if((side[i]>0)!==(side[(i+1)%n]>0))cr.push(i);
  if(cr.length!==2)return;
  const[i1,i2]=cr;
  const ip=i=>{const j=(i+1)%n,t=side[i]/(side[i]-side[j]),p=pts[i],q=pts[j];
    return{x:p.x+(q.x-p.x)*t,y:p.y+(q.y-p.y)*t,px:p.px+(q.px-p.px)*t,py:p.py+(q.py-p.py)*t}};
  const I1=ip(i1),I2=ip(i2);
  const avgL=b.L.reduce((s,v)=>s+v,0)/n;
  const mk=I=>Object.assign(P(I.x,I.y),{px:I.px,py:I.py,cut:true});
  const chord=(F,T)=>{const d=Math.hypot(T.x-F.x,T.y-F.y),k=Math.max(0,Math.round(d/avgL)-1),o=[];
    for(let i=1;i<=k;i++){const t=i/(k+1);o.push(mk({x:F.x+(T.x-F.x)*t,y:F.y+(T.y-F.y)*t,px:F.px+(T.px-F.px)*t,py:F.py+(T.py-F.py)*t}))}return o};
  const ring=(f,t)=>{const o=[];for(let k=f;;k=(k+1)%n){o.push(pts[k]);if(k===t)break}return o};
  const p1=[mk(I1),...ring((i1+1)%n,i2),mk(I2),...chord(I2,I1)];
  const p2=[mk(I2),...ring((i2+1)%n,i1),mk(I1),...chord(I1,I2)];
  const O={x:b.cx+b.texOff.x*Math.cos(b.rot)-b.texOff.y*Math.sin(b.rot),y:b.cy+b.texOff.x*Math.sin(b.rot)+b.texOff.y*Math.cos(b.rot)};
  const TA=b.texRot0+b.rot,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;
  remove(b);if(!silent){sfx.cut();game.ev.cut=1;ptr.combo++;ptr.cx=(I1.x+I2.x)/2;ptr.cy=(I1.y+I2.y)/2;fx.push({k:'slash',x1:I1.x-(I2.x-I1.x)*.25,y1:I1.y-(I2.y-I1.y)*.25,x2:I2.x+(I2.x-I1.x)*.25,y2:I2.y+(I2.y-I1.y)*.25,t:0,life:12});if(b.R>12)wetSplat(b,b.R*.55)}
  for(const[pp,sg]of[[p1,side[(i1+1)%n]>0?1:-1],[p2,side[(i2+1)%n]>0?1:-1]]){
    for(const p of pp){p.x+=nx*sg*1.5;p.y+=ny*sg*1.5;p.px+=nx*sg*.6;p.py+=ny*sg*.6}
    const a=Math.abs(polyArea(pp));
    if(pp.length<6||a<90){spray(pp,b.m,Math.max(3,a/25),b.type);continue}
    let cx=0,cy=0;for(const p of pp){cx+=p.x;cy+=p.y}cx/=pp.length;cy/=pp.length;
    const nb=add(initBody(b.type,pp,{chunk:b.chunk,tex:b.tex,texOff:{x:O.x-cx,y:O.y-cy},texRot0:TA,inv:10,state:stateOf(b),mat:b.m}));nb.split=b.split;nb.shard=b.shard;
  }
  const m=b.m;if(b.type==='jelly'||m.shards||b.type==='kernel')return;
  const cnt=Math.min(24,3+b.R*.3);
  for(let i=0;i<cnt;i++){const t=Math.random(),x=I1.x+(I2.x-I1.x)*t,y=I1.y+(I2.y-I1.y)*t,sg=Math.random()<.5?1:-1;
    drop(x,y,nx*sg*rnd(.5,3),ny*sg*rnd(.5,3)-rnd(0,1.5),m.juice,rnd(1.2,3))}
  buzz(12);
}

function closedBoxAt(x,y){for(const o of BOXES)if(!o.open&&inBox(o,x,y))return o;return null}

function mixMaterial(parts,A){

function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*2;NB=AC.createBuffer(1,n,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const mk=(type,f,q,osc)=>{const g=AC.createGain();g.gain.value=0;let src;if(osc){src=AC.createOscillator();src.frequency.value=osc}else{src=AC.createBufferSource();src.buffer=NB;src.loop=true}
    const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;src.connect(fl).connect(g).connect(AC.destination);src.start();return g};
  loops.nodes.sizzle=mk('bandpass',4200,.6);loops.nodes.gas=mk('lowpass',380,.7);loops.nodes.hum=mk('lowpass',200,1,120);loops.nodes.oven=mk('lowpass',260,.8);loops.nodes.mixer=mk('bandpass',1500,2.5);
}catch(e){AC=null}}
function ok(){if(!AC||muted||sndBudget>5)return false;sndBudget++;if(AC.state==='suspended')AC.resume();return true}
function noise(dur,type,f0,f1,vol,q=1){if(!ok())return;const t=AC.currentTime,s=AC.createBufferSource();s.buffer=NB;s.playbackRate.value=rnd(.7,1.3);
  const f=AC.createBiquadFilter();f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.001,vol),t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(AC.destination);s.start(t,rnd(0,1));s.stop(t+dur+.05)}
function tone(f0,f1,dur,vol,type='sine'){if(!ok())return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02)}

    else if(w.t==='mixed'){s=clamp(a.mixedMax/w.v,0,1);label='Gemixt';note=a.mixedMax?a.mixedMax+' Zutaten':'nichts'}
    else if(w.t==='baked'){s=a.baked;label='Gebacken';note=a.baked>=1?'goldbraun':a.baked?'noch roh':'nichts'}
    else if(w.t==='fried'){s=clamp(a.fried/.3,0,1);label='Frittiert';note=Math.round(a.fried*100)+' %'}
    else if(w.t==='grilled'){s=clamp(a.grilled/.3,0,1);label='Gegrillt';note=Math.round(a.grilled*100)+' %'}
    res.push({t:w.t,w:w.w,s,label,note})}
  let score=0,ws=0;for(const r of res){score+=r.s*r.w;ws+=r.w}score=Math.round(score/ws*100);
  if(a.burnt>.5)score=Math.round(score*.6);if(!items.length)score=0;
  const worst=res.slice().sort((x,y)=>x.s-y.s)[0];
  let quote=score>=85?c.good:score>=50?c.ok:c.bad;
  if(!items.length)quote='Der Teller ist ja leer!';
  else if(worst&&worst.s<.5&&score<85){const key=worst.t==='done'?(a.raw>a.burnt?'raw':'burnt'):worst.t;quote=LINES[key]+' '+(score>=50?c.ok:c.bad)}
  const dish=Object.entries(a.names).map(([n,k])=>k>1?`${k}× ${n}`:n).join(', ');
  return{score,res,quote,dish,stars:score>=85?3:score>=65?2:score>=45?1:0}}

function drawFace(g,c,mood=0,size=120,bgOn=true){

  if(L.pearls){g.fillStyle='#fffaf0';for(let i=0;i<9;i++){const a=Math.PI*(.2+i*.075);g.beginPath();g.arc(50+Math.cos(a)*16,78+Math.sin(a)*9-4,1.9,0,TAU);g.fill()}}

  if(L.style==='bun'){g.beginPath();g.arc(50,16,11,0,TAU);g.fill()}
  if(L.style==='curly'){for(let i=0;i<12;i++){const a=Math.PI*(1+i/11);g.beginPath();g.arc(50+Math.cos(a)*26,44+Math.sin(a)*28,9,0,TAU);g.fill()}for(const x of[24,76]){g.beginPath();g.arc(x,54,9,0,TAU);g.fill()}}
  if(L.style==='bob'){g.beginPath();g.ellipse(50,46,29,30,0,0,TAU);g.fill();g.fillRect(21,46,58,18)}
  g.fillStyle=L.skin;for(const x of[23,77]){g.beginPath();g.ellipse(x,48,5,7,0,0,TAU);g.fill()}
  g.beginPath();g.ellipse(50,46,25,28,0,0,TAU);g.fill();
  if(L.cheeks||mood>.3){g.fillStyle='rgba(255,110,110,.35)';for(const x of[36,64]){g.beginPath();g.ellipse(x,56,5,3.2,0,0,TAU);g.fill()}}
  const ey=44,brow=mood<-.2?1:mood>.3?-1:0;
  for(const sx of[-1,1]){const x=50+sx*10;g.fillStyle='#fff';g.beginPath();g.ellipse(x,ey,4.6,mood>.6?2:4,0,0,TAU);g.fill();
    g.fillStyle='#2a1a10';g.beginPath();g.arc(x+(mood<-.4?0:.5),ey+.5,2.3,0,TAU);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(x+1.2,ey-.6,.8,0,TAU);g.fill();
    g.strokeStyle=L.style==='bald'?dk:mix(L.hair,'#2a1a10',.3);g.lineWidth=2.2;g.lineCap='round';g.beginPath();
    g.moveTo(x-5*sx,ey-8+(brow>0?-2:brow<0?1:0));g.lineTo(x+4*sx,ey-8+(brow>0?2:brow<0?-1:0));g.stroke()}
  g.strokeStyle=dk;g.lineWidth=1.6;g.beginPath();g.moveTo(50,47);g.quadraticCurveTo(46,55,50,56);g.stroke();
  const my=63,curve=mood*7;g.strokeStyle='#7a2a1a';g.lineWidth=2.4;g.lineCap='round';
  if(mood>.55){g.fillStyle='#7a1a10';g.beginPath();g.moveTo(41,my-1);g.quadraticCurveTo(50,my+11,59,my-1);g.closePath();g.fill();g.fillStyle='#fff';g.fillRect(44,my-1,12,2.5)}
  else{g.beginPath();g.moveTo(42,my);g.quadraticCurveTo(50,my+curve,58,my);g.stroke()}
  if(L.lips){g.strokeStyle='#e03050';g.lineWidth=1.4;g.stroke()}

  if(L.beard){g.fillStyle=L.beard;g.globalAlpha=.85;g.beginPath();g.moveTo(26,52);g.quadraticCurveTo(28,78,50,78);g.quadraticCurveTo(72,78,74,52);g.quadraticCurveTo(70,66,58,66);g.quadraticCurveTo(50,70,42,66);g.quadraticCurveTo(30,66,26,52);g.fill();g.globalAlpha=1}
  if(L.goatee){g.fillStyle=L.goatee;g.beginPath();g.moveTo(45,68);g.quadraticCurveTo(50,80,55,68);g.closePath();g.fill()}
  g.fillStyle=L.hair;
  if(L.style==='bun'||L.style==='short'){g.beginPath();g.ellipse(50,26,24,10,0,Math.PI,TAU);g.fill();g.beginPath();g.ellipse(50,24,22,8,0,0,TAU);g.fill()}
  if(L.style==='curly'){for(let i=0;i<6;i++){g.beginPath();g.arc(32+i*7,22+Math.sin(i)*2,7,0,TAU);g.fill()}}
  if(L.style==='bob'){g.beginPath();g.moveTo(24,40);g.quadraticCurveTo(30,14,52,18);g.quadraticCurveTo(70,18,76,40);g.quadraticCurveTo(60,28,44,34);g.quadraticCurveTo(32,36,24,40);g.fill()}

  if(L.style==='bald'){g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.ellipse(42,26,7,4,-.3,0,TAU);g.fill()}
  if(L.glasses){g.strokeStyle='#2a1a10';g.lineWidth=1.8;for(const sx of[-1,1]){g.beginPath();L.glasses==='round'?g.arc(50+sx*10,44,6.5,0,TAU):g.rect(50+sx*10-7,39,14,10);g.stroke()}g.beginPath();g.moveTo(46,44);g.lineTo(54,44);g.stroke()}
  if(L.monocle){g.strokeStyle='#c8a030';g.lineWidth=1.8;g.beginPath();g.arc(60,44,6.5,0,TAU);g.stroke();g.beginPath();g.moveTo(66,46);g.quadraticCurveTo(70,60,66,72);g.stroke()}
  if(L.bow){g.fillStyle=L.bow;g.beginPath();g.ellipse(66,18,7,4,.5,0,TAU);g.ellipse(76,24,7,4,.5,0,TAU);g.fill();g.beginPath();g.arc(71,21,3,0,TAU);g.fill()}
  if(L.beret){g.fillStyle=L.beret;g.beginPath();g.ellipse(46,20,27,10,-.15,0,TAU);g.fill();g.fillRect(44,8,3,5)}
  if(L.chefhat){g.fillStyle='#ffffff';g.fillRect(30,12,40,12);for(const[x,y,r]of[[34,8,10],[50,2,12],[66,8,10]]){g.beginPath();g.arc(x,y,r,0,TAU);g.fill()}g.strokeStyle='#e0d6c4';g.lineWidth=1;g.strokeRect(30,18,40,6)}
  g.restore();
}

function startTutorial(){
  game.mode='tutorial';game.pantry={tomato:99,steak:99};resetKitchen();updTray();goStation(0);camX=camT;show(null);
  const c=Object.assign({},CRITICS[0],{idx:-1});setHud(c,'tutorial');scr('hudWish').innerHTML='<li>ein braunes Steak</li>';
  tutI=0;scr('coach').hidden=false;tutShow();lockLandscape();
}
function tutShow(){
  if(tutEl)tutEl.classList.remove('pulse');tutEl=null;game.mark=null;
  if(tutI>=TUT.length){scr('coach').hidden=true;return}
  const s=TUT[tutI];scr('coachStep').textContent=`Schritt ${tutI+1} von ${TUT.length}`;scr('coachText').textContent=s.t;
  if(s.el){tutEl=s.el();if(tutEl)tutEl.classList.add('pulse')}
}
function tutTick(){if(game.mode!=='tutorial'||tutI>=TUT.length)return;const s=TUT[tutI];if(s.mark)game.mark=s.mark();
  if(s.ok()){tutI++;sfx.click();tutShow()}}
scr('coachSkip').addEventListener('click',()=>{game.save.tut=true;saveGame();scr('coach').hidden=true;if(tutEl)tutEl.classList.remove('pulse');openMenu()});

/* ================= sizing & loop ================= */
const sa=scr('sa');
function resize(){
  const r=cv.getBoundingClientRect(),oVW=LY.vw,oSide=LY.side,stn=LY.vw?stationIdx():0;
  let old=null;if(WW){old=document.createElement('canvas');old.width=st.width;old.height=st.height;old.getContext('2d').drawImage(st,0,0)}
  W=r.width;H=r.height;DPR=Math.min(2,window.devicePixelRatio||1);
  const cs=getComputedStyle(sa);LY.saL=parseFloat(cs.paddingLeft)||0;LY.saR=parseFloat(cs.paddingRight)||0;LY.saB=parseFloat(cs.paddingBottom)||0;
  layout();
  BD=Math.min(DPR,1.5,Math.sqrt(14e6/(WW*H)));
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  for(const c of[bg,st]){c.width=Math.round(WW*BD);c.height=Math.round(H*BD)}
  stx.setTransform(BD,0,0,BD,0,0);if(old)stx.drawImage(old,0,0,WW,H);
  if(oVW&&oVW!==LY.vw)for(const b of bodies)for(const p of b.pts){p.x=LY.side+(p.x-oSide)*LY.vw/oVW;p.px=LY.side+(p.px-oSide)*LY.vw/oVW}
  camT=camX=stn*LY.vw;
  drawBg();updTabs();
  scr('rotate').hidden=!(H>W*1.05&&W<900);
}
addEventListener('resize',resize);resize();
openMenu();
document.fonts&&document.fonts.ready.then(()=>{drawBg();scr('logoBig').innerHTML=logoSVG()});

let last=performance.now(),acc=0,tick=0;
function loop(t){
  const dt=Math.min(60,t-last);acc+=dt;last=t;let n=0;
  while(acc>=1000/60&&n<3){sndBudget=0;step();acc-=1000/60;n++}
  if(game.running){game.time-=dt/1000;if(++tick%6===0)updTimer();if(game.time<=0){game.time=0;game.running=false;updTimer();serve(true)}}
  if(game.mode==='tutorial')tutTick();
  render();if(tick++%10===0)updMess();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.addEventListener('visibilitychange',()=>{if(AC){document.hidden?AC.suspend():AC.resume()}last=performance.now()});
window.__kitchen={ptr,bodies:()=>bodies,fx:()=>fx,pan,pot,grill,fryer,freezer,oven,micro,bowl,plate,spawn,step,controls,where,LY,game,startLevel,startSandbox,startTutorial,judge,CRITICS,startMix,level,goStation,M,FOODS,cam:()=>[camX,camT]};
})();
</script>
